<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FVG Trader</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FVG Trader">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f5bd3'/%3E%3Crect x='7' y='6' width='5' height='12' fill='white'/%3E%3Crect x='14' y='11' width='5' height='14' fill='white' opacity='.55'/%3E%3Crect x='21' y='15' width='5' height='11' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: feste Kopfzeile mit Modus-Schalter & Notaus → Reiter → Cockpit (Vorschläge zuerst, dann Positionen, dann Verlauf) */
:root{
  --bg:#070b14; --surface:#0d1424; --raise:#111a2e; --sunk:#0a101d; --line:#1a2540; --line2:#24314f; --fg:#e4e9f2; --muted:#7d8aa5;
  --accent:#4c8dff; --accent-fg:#fff; --pos:#2fd39a; --neg:#ff5d6c; --warn:#f2b441; --fill:rgba(76,141,255,.13);
  --pos-bg:rgba(47,211,154,.09); --neg-bg:rgba(255,93,108,.09); --warn-bg:rgba(242,180,65,.12);
  --f-display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
body{background:radial-gradient(1200px 500px at 50% -200px,rgba(76,141,255,.08),transparent 70%) var(--bg) fixed}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{color:var(--fg);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 60px max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}

/* Kopfzeile mit Auswahlleiste oben */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;flex:none}
.brand i{display:inline-block;width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--pos)))}
.nav{display:flex;gap:2px;margin:0 auto;padding:3px;background:var(--sunk);border-radius:12px}
.nav button{display:flex;align-items:center;gap:8px;padding:8px 14px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:500 14px var(--f-body);white-space:nowrap;transition:background .12s,color .12s}
.nav button:hover{color:var(--fg)}
.nav svg{width:18px;height:18px;flex:none;display:block}
.nav button[aria-current=true]{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar-r{display:flex;align-items:center;gap:10px;flex:none}
.status{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:14px}
.status .hint{font-size:11.5px;margin-left:auto}
.content{min-width:0}
.nav button em{display:none}
@media (max-width:1060px){ .nav button span{display:none} .nav button{padding:8px 12px} .nav button[aria-current=true] span{display:inline} }
@media (max-width:820px){
  .bar{flex-wrap:wrap;gap:10px 12px}
  .brand{font-size:16px;margin-right:auto}
  .nav{order:3;width:100%;display:grid;grid-template-columns:repeat(7,1fr);margin:0}
  .nav button{flex-direction:column;gap:3px;padding:6px 0;font-size:10.5px}
  .nav button span,.nav button[aria-current=true] span{display:none}
  .nav button em{display:inline;font-style:normal;white-space:nowrap}
  .status .hint{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:18px}
  .switch b{display:none}
}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--pos)} .dot.bad{background:var(--neg)} .dot.warn{background:var(--warn)}
.switch{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.switch b{font-weight:600;font-size:13px}
.tgl{position:relative;width:46px;height:26px;border-radius:999px;border:0;background:var(--line);transition:background .15s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tgl[aria-checked=true]{background:var(--pos)} .tgl[aria-checked=true]::after{transform:translateX(20px)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:7px 12px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.good{background:var(--pos);border-color:var(--pos);color:#fff;font-weight:600}
.btn.danger{background:var(--neg);border-color:var(--neg);color:#fff;font-weight:600}
.btn.ghost-danger{color:var(--neg);border-color:var(--neg)}
.btn:disabled{opacity:.5;cursor:default}
.banner{margin:12px 0 0;padding:10px 14px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-weight:500}

main{display:flex;flex-direction:column;gap:22px;padding-top:22px;padding-bottom:40px}
h2{font-family:var(--f-display);font-weight:600;font-size:16px;margin:0}
.section{display:flex;flex-direction:column;gap:10px;min-width:0}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.empty{color:var(--muted);font-size:13px;padding:18px;border:1px dashed var(--line);border-radius:8px;text-align:center}

/* Kennzahlen */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:500 13px var(--f-body);background:transparent;color:var(--muted);border:0;border-right:1px solid var(--line);padding:7px 12px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fill);color:var(--accent);font-weight:600}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--neg)}

/* Vorschläge */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.sug{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.sug.long{border-left-color:var(--pos)} .sug.short{border-left-color:var(--neg)}
.sug-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.side{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.02em}
.side.long{color:var(--pos)} .side.short{color:var(--neg)}
.chip{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:4px;background:var(--fill);color:var(--accent);font-weight:500;white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.good{background:var(--pos-bg);color:var(--pos)}
.chip.bad{background:var(--neg-bg);color:var(--neg)}
.chip.mute{background:var(--sunk);color:var(--muted)}
.timer{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px}
.lv div{display:flex;flex-direction:column;min-width:0}
.lv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lv b{font-family:var(--f-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.edit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.edit label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.edit input{width:100%}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.actions{display:flex;gap:8px}
.actions .btn{flex:1;padding:9px 12px}

/* Tabellen */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{font-family:var(--f-mono);font-size:12.5px;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.t,th.t{text-align:left;font-family:var(--f-body)}
td.wrap{white-space:normal;min-width:260px;font-family:var(--f-body);font-size:12.5px;text-align:left;color:var(--muted)}
tr:last-child td{border-bottom:0}
.rowbtns{display:flex;gap:6px;justify-content:flex-end}
.rowbtns .btn{padding:4px 9px;font-size:12px}

.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.wizard{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:14px}
.wizard li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start}
.wizard .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--sunk);color:var(--muted)}
.wizard li.done .num{background:var(--pos-bg);color:var(--pos)}
.wizard li.now .num{background:var(--accent);color:var(--accent-fg)}
.wizard li.done .hint{display:none}
.feed{display:flex;flex-direction:column;gap:0;max-height:360px;overflow:auto}
.feed div{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.feed time{font-family:var(--f-mono);color:var(--muted);font-size:11.5px}
.feed .warn{color:var(--warn)} .feed .error{color:var(--neg)}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.gl{stroke:var(--line)}

/* Performance & Grafiken */
.perf{display:flex;flex-direction:column;gap:14px}
.perf-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.perf-ctl{display:flex;gap:8px;flex-wrap:wrap}
.perf-b{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.ring{position:relative;width:170px;height:170px;flex:none}
.ring svg{display:block}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-v{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.ring-l{font-size:12px;color:var(--muted)}
.perf-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.perf-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.perf-stats div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:8px;background:var(--sunk);min-width:0}
.perf-stats span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.perf-stats b{font-family:var(--f-mono);font-size:17px;font-weight:500;white-space:nowrap}
.spark{border-radius:8px;background:var(--sunk);padding:6px}
.spark svg{width:100%;display:block}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:12px;align-items:center}
.hbar-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.hbar-l .hint{font-size:11.5px}
.hbar-t{position:relative;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.hbar-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.hbar-t i{position:absolute;top:0;bottom:0;border-radius:5px}
.hbar-t i.p{left:50%;background:var(--pos)} .hbar-t i.n{right:50%;background:var(--neg)}
.hbar b{font-size:13px;text-align:right;min-width:70px}
.panel{box-shadow:0 1px 2px rgba(10,15,30,.04)}
@media (max-width:720px){ .perf-b{grid-template-columns:1fr;justify-items:center} .perf-side{width:100%} .perf-stats{grid-template-columns:repeat(2,minmax(0,1fr))} }

.sess-list{display:flex;flex-direction:column;gap:6px}
.sess{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.sess.on,.sess:has(input:checked){border-color:var(--accent);background:var(--fill)}
.sess-n{font-size:13.5px;font-weight:500}
.sess-t{font-size:12px}
@media (max-width:560px){ .sess{grid-template-columns:20px minmax(0,1fr)} .sess-t{grid-column:2} }

/* Kalender */
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cal-mon{display:flex;align-items:center;gap:6px}
.cal-mon h2{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 8px 0 2px;min-width:0;text-transform:none;color:var(--fg)}
.cal-mon h2 small{font-weight:400;color:var(--muted);margin-left:6px}
.ibtn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);padding:0}
.ibtn:hover{color:var(--fg);border-color:var(--line2)}
.ibtn svg{width:16px;height:16px}
.cal-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.strip{display:grid;grid-template-columns:1.4fr repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px}
.strip > div{padding:14px 18px;display:flex;flex-direction:column;gap:4px;min-width:0;border-left:1px solid var(--line)}
.strip > div:first-child{border-left:0}
.strip .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.strip .v{font-family:var(--f-mono);font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .big{font-size:28px;font-weight:600;letter-spacing:-.02em}
.strip .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--sunk);margin-top:3px}
.wl i{display:block;height:100%}
@media (max-width:820px){ .strip{grid-template-columns:repeat(2,minmax(0,1fr))} .strip > div{border-left:0;border-top:1px solid var(--line)} .strip > div:first-child{grid-column:1/-1;border-top:0} .strip > div:nth-child(odd):not(:first-child){border-left:1px solid var(--line)} }
.calbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;overflow:hidden}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.05fr);gap:6px}
.cal .dow{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;padding:8px 10px 2px}
.day{position:relative;min-height:96px;border:1px solid var(--line);border-radius:9px;background:var(--raise);padding:9px 11px;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;min-width:0;cursor:pointer;transition:border-color .12s,background .12s,transform .12s}
.day:hover{border-color:var(--line2);background:color-mix(in srgb,var(--raise) 80%,var(--accent) 6%)}
.day.win{background:linear-gradient(180deg,rgba(47,211,154,.13),rgba(47,211,154,.04));border-color:rgba(47,211,154,.28)}
.day.loss{background:linear-gradient(180deg,rgba(255,93,108,.13),rgba(255,93,108,.04));border-color:rgba(255,93,108,.28)}
.day.win:hover{border-color:rgba(47,211,154,.6)} .day.loss:hover{border-color:rgba(255,93,108,.6)}
.day.empty{background:transparent}
.day.out{background:transparent;border-color:transparent;opacity:.35;cursor:default}
.day.sel{border-color:var(--accent)!important;box-shadow:0 0 0 1px var(--accent),0 6px 20px rgba(76,141,255,.18)}
.day .dn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500;display:flex;align-items:center;gap:6px}
.day.today .dn b{background:var(--accent);color:#fff;border-radius:6px;padding:0 6px;font-weight:600}
.day .dn b{font-weight:500}
.day .pl{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto}
.day .pl .s{display:none}
.day .meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.dots{display:flex;gap:3px;flex-wrap:wrap;max-width:100%}
.dots i{width:6px;height:6px;border-radius:2px;background:var(--line2)}
.dots i.w{background:var(--pos)} .dots i.l{background:var(--neg)}
.wk{border-radius:9px;border:1px dashed var(--line2);background:transparent;padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-height:96px;min-width:0}
.wk .dn{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.wk .pl{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto}
.wk .meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .pl .s,.wk .dn .s,.day .meta .s,.wk .meta .s{display:none}
.daybox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.daybox-h{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.daybox-h h2{font-size:15px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--fg)}
.daybox-h .v{font-family:var(--f-mono);font-size:18px;font-weight:600}
.daybox-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.daybox table{margin:0}
.daybox .empty{margin:16px;border-color:var(--line2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media (max-width:640px){
  .calbox{padding:4px}
  .cal{gap:3px}
  .day,.wk{min-height:60px;padding:5px 6px;border-radius:7px}
  .day .pl,.wk .pl{font-size:10.5px;letter-spacing:-.03em;text-overflow:clip}
  .day,.wk{padding:5px 4px}
  .day .pl .f,.wk .pl .f,.wk .dn .f{display:none} .day .pl .s,.wk .pl .s,.wk .dn .s{display:inline}
  .day .meta,.wk .meta,.dots{display:none}
  .cal .dow{font-size:9.5px;padding:4px 4px 0}

.pc-pl b{font-size:24px;font-weight:600;letter-spacing:-.02em} .pc-pl small{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.pc-bar{display:flex;flex-direction:column;gap:4px}
.pc-track{position:relative;height:8px;border-radius:4px;background:var(--sunk)}
.pc-risk{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,93,108,.55),rgba(255,93,108,.12));border-radius:4px 0 0 4px}
.pc-rew{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,rgba(47,211,154,.12),rgba(47,211,154,.55));border-radius:0 4px 4px 0}
.pc-mk{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:50%}

.pc-bl{position:relative;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);height:15px}
.pc-le{position:absolute;transform:translateX(-50%)}
.pc-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pc-c{padding:10px 14px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);min-width:0}

.pc-c .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.pc-c > b{font-size:18px;font-weight:600}
.pc-c small{font-size:11.5px;color:var(--muted);line-height:1.45}
.pc-c small.pos{color:var(--pos)} .pc-c small.neg{color:var(--neg)}
.pc-a{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px 16px;align-items:start}
.pc-e{display:flex;flex-direction:column;gap:4px;min-width:0}
.pc-e label{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.pc-in{display:flex;gap:4px;flex-wrap:wrap}
.pc-in input{width:110px;flex:1;min-width:90px}
.pc-in .btn{padding:6px 10px}
.pc-q{display:flex;flex-direction:column;gap:6px;align-self:end}
@media (max-width:1000px){ .pc-a{grid-template-columns:1fr} .pc-q{flex-direction:row;flex-wrap:wrap} }
@media (max-width:760px){ .pc-g{grid-template-columns:repeat(2,minmax(0,1fr))} .pc-c:nth-child(3){border-left:0} .pc-c:nth-child(n+3){border-top:1px solid var(--line)} .pc{padding:12px} .pc-pl{margin-left:0;width:100%;flex-direction:row;align-items:baseline;gap:8px} }
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pos);margin-right:4px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,211,154,.6)}70%{box-shadow:0 0 0 6px rgba(47,211,154,0)}100%{box-shadow:0 0 0 0 rgba(47,211,154,0)}}
.ssn{display:flex;gap:4px;flex-wrap:wrap}
.ssn .chip b{font-weight:600;margin-left:2px}
.td-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px;padding:8px 0 2px;border-top:1px solid var(--line)}
.td-g div{display:flex;flex-direction:column;gap:1px;min-width:0}
.td-g .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.td-g b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-g small{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{display:flex;flex-direction:column;gap:10px}
.bt-drop{border:1.5px dashed var(--line2);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:13px;transition:all .12s}
.bt-drop.over{border-color:var(--accent);background:var(--fill);color:var(--fg)}
.bt-seg{flex-wrap:wrap;align-self:flex-start}
.modal-bg{position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal select{width:100%}
.modal:has(.logbox){max-width:820px}
.logbox{max-height:min(60vh,520px);overflow:auto;white-space:pre;word-break:normal;margin:0;font-size:11.5px;line-height:1.45}

/* Einstellungen */
.settings-wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:10px;width:100%;padding-top:4px}
.set-sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;scroll-margin-top:130px;display:flex;flex-direction:column;gap:12px;min-width:0}
.set-h{display:flex;flex-direction:column;gap:2px}
.set-h h2{font-size:16px}
.set-b{display:flex;flex-direction:column;gap:10px;min-width:0}
.sub{display:flex;flex-direction:column;gap:10px;padding-left:12px;border-left:2px solid var(--line)}
.form{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,42%);gap:12px;align-items:center}
.row[hidden]{display:none}
.row label{font-size:13.5px}
.row small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.row input,.row select{width:100%}
.row .tgl,.row > .btn,.row .chk{justify-self:end}
.row input.chk,.chk{width:18px;height:18px;accent-color:var(--accent)}
.inline{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.inline input[type=time]{width:auto}
.wrap-gap{justify-content:flex-start}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:4px 0 4px}
.preview{display:flex;flex-direction:column;gap:4px;background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:12.5px}
.preview div{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline}
.pv{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pv b{color:var(--fg);font-weight:500}
details.set-sec{padding:0;display:block}
details.set-sec > summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:36px minmax(0,1fr) auto 16px;gap:12px;align-items:center;padding:14px 18px;border-radius:12px}
details.set-sec > summary:hover{background:var(--sunk)}
details.set-sec > summary::-webkit-details-marker{display:none}
details.set-sec > summary::after{content:"▾";color:var(--muted);transition:transform .15s;text-align:center}
details.set-sec[open] > summary::after{transform:rotate(180deg)}
details.set-sec[open] > summary{border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
.s-ic{width:36px;height:36px;border-radius:10px;background:var(--fill);color:var(--accent);display:grid;place-items:center}
.s-ic svg{width:19px;height:19px;display:block}
.s-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.s-t b{font-size:15px;font-family:var(--f-display)}
.s-t .hint{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-chip{display:flex;gap:6px}
details.set-sec > .set-b{padding:16px 20px 20px}
details.set-sec > .set-b > .hint:first-child{margin:0 0 2px}
@media (max-width:640px){ details.set-sec > summary{grid-template-columns:32px minmax(0,1fr) 16px;padding:12px 14px} .s-chip{display:none} .s-ic{width:32px;height:32px} }
.savebar{position:sticky;bottom:max(12px,env(safe-area-inset-bottom,0px));margin:14px auto 0;max-width:820px;width:100%;display:flex;gap:10px;align-items:center;justify-content:flex-end;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:6}
.savebar .hint{margin-right:auto}
@media (max-width:560px){ .row{grid-template-columns:1fr} .row .tgl,.row > .btn,.row .chk{justify-self:start} .inline{justify-content:flex-start} }
.save{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.ok-msg{font-size:12.5px;color:var(--pos)} .err-msg{font-size:12.5px;color:var(--neg)}
.code{font-family:var(--f-mono);font-size:12px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px;word-break:break-all;white-space:pre-wrap}
.copyrow{display:flex;gap:8px;align-items:stretch}
.copyrow .code{flex:1;min-width:0}
ol.steps{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13px}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{width:min(360px,100%);display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
.login h1{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0}

.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Look wie ein Trading-Terminal: Navy, feine Linien, kleine Großbuchstaben-Labels */
.btn{border-radius:8px;background:var(--raise);border-color:var(--line2);font-size:13px;transition:border-color .12s,background .12s}
.btn:hover:not(:disabled){border-color:color-mix(in srgb,var(--accent) 45%,var(--line2))}
.btn.primary{box-shadow:0 4px 14px rgba(76,141,255,.25)}
.btn.primary:hover:not(:disabled){filter:brightness(1.1)}
.btn.danger{background:transparent;color:var(--neg);border-color:rgba(255,93,108,.5)}
.btn.danger:hover{background:var(--neg-bg)!important}
.btn.ghost-danger{background:transparent;border-color:rgba(255,93,108,.45)}
input,select{background:var(--sunk);border-color:var(--line2);border-radius:8px}
.panel,.kpis,.set-sec{background:var(--surface);border-color:var(--line);border-radius:12px}
.kpi{background:transparent}
.kpi .l,.lbl,th{font-size:10.5px!important;letter-spacing:.1em!important;font-weight:600}
.section > .section-h h2,.section > h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.seg{background:var(--sunk);border-color:var(--line);border-radius:9px;padding:2px}
.seg button{border-right:0;border-radius:7px;padding:6px 12px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line2)}
.chip{border-radius:5px;font-size:11px;font-weight:600;letter-spacing:.01em}
.pill{background:var(--surface)!important;border:1px solid var(--line)!important}
.switch{background:var(--raise);border-color:var(--line2)}
.tgl{background:var(--line2)}
.code{background:var(--sunk)!important;border-color:var(--line)!important}
.sess{background:var(--raise)}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:2px solid var(--bg)} ::-webkit-scrollbar-track{background:transparent}

/* Tageszusammenfassung */
.td{display:flex;flex-direction:column;gap:14px}
.td-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.td-top{display:grid;grid-template-columns:minmax(200px,1.1fr) 3fr;gap:18px;align-items:center}
.td-pl{display:flex;flex-direction:column;gap:2px}
.td-pl b{font-family:var(--f-mono);font-size:34px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.td-pl small,.td-c small{color:var(--muted);font-size:12px}
.td-cs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.td-c{display:flex;flex-direction:column;gap:2px;padding:4px 14px;border-left:1px solid var(--line);min-width:0}
.td-c b{font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-m{display:flex;flex-direction:column;gap:4px}
.td-mt{position:relative;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.td-mt i{position:absolute;top:0;bottom:0;border-radius:99px}
.td-mt i.p{background:var(--pos)} .td-mt i.n{background:var(--neg)}
.td-mt b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--muted);transform:translateX(-1px)}
.td-ml{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.td-chips{display:flex;flex-wrap:wrap;gap:6px}
.td-chips .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;max-width:100%;white-space:normal;line-height:1.4}
.hc{border-top:1px solid var(--line);padding-top:10px}
.hc-sum{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;color:var(--fg);font:500 13px var(--f-body);cursor:pointer;padding:2px 0;text-align:left}
.hc-dots{display:inline-flex;gap:5px}
.hc-ch{margin-left:auto;color:var(--accent);font-size:12.5px}
.hc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px 18px;margin-top:10px}
.hc-i{display:grid;grid-template-columns:10px auto 1fr;gap:8px;align-items:center;font-size:12.5px;padding:4px 0}
.hc-i span:last-child{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
@media (max-width:820px){.td-top{grid-template-columns:1fr}.td-cs{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:10px}.td-c:nth-child(odd){border-left:0;padding-left:0}}
/* Timeline */
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:44px 14px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}
.tl-i:last-child{border-bottom:0}
.tl-i time{font-size:11.5px;color:var(--muted);padding-top:3px}
.tl-d{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--muted)}
.tl-i.in .tl-d{background:var(--accent)} .tl-i.bl .tl-d{background:var(--warn)}
.tl-c{min-width:0;display:flex;flex-direction:column;gap:3px}
.tl-h{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.tl-w{font-size:12.5px;color:var(--muted);line-height:1.45}
.tl-o{display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:right;white-space:nowrap}
.tl-o small{font-size:11px;color:var(--muted)}
.tl-old summary{cursor:pointer;margin:4px 0}
#sigBox{max-height:560px;overflow:auto}
.flags .chip.wrapc{white-space:normal;text-align:left;line-height:1.45}
/* Journal */
.jr{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.jr-t{width:100%;resize:vertical;min-height:38px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:13px/1.45 var(--f-body);padding:7px 9px}
.jr-t:focus{outline:2px solid var(--accent);outline-offset:-1px}
.jr-s{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.jr-img{position:relative;width:74px;height:50px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.jr-img img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.jr-x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:18px;padding:0;cursor:pointer}
.jr-add{font-size:12px;color:var(--accent);border:1px dashed var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
/* Wochenbericht, Vergleich, Monte-Carlo */
.wk-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wk-head h2{font-size:19px;text-transform:none;letter-spacing:0;color:var(--fg);margin:2px 0 0}

.cmp-notes{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.cmp-n{display:flex;gap:8px;align-items:center;font-size:13px}
table.cmp td,table.cmp th{white-space:normal}
.cmp-m{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.cmp-m > div{display:flex;flex-direction:column;gap:2px}
.cmp-m b{font-size:22px} .cmp-m small{font-size:12px;color:var(--muted)}
.mc-ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}

.mc-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--sunk);margin-bottom:12px}
.mc-bar i.p{background:var(--pos)} .mc-bar i.o{background:var(--muted);opacity:.5} .mc-bar i.n{background:var(--neg)}
@media (max-width:820px){.mc-big{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:12px}.mc-big > div:nth-child(odd){border-left:0;padding-left:0}}
.pc-sm{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.5;padding:8px 10px;margin:8px 0 2px;border-radius:8px;background:var(--sunk)}
.pc-sm .dot{margin-top:6px;flex-shrink:0}
.df-list{display:flex;flex-direction:column;gap:10px}
.df-c{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.df-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.df-s{display:flex;flex-wrap:wrap;gap:6px 22px}

.df-a{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}

.df-d{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}

.gh{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.5;padding:7px 10px;margin-top:6px;border-radius:8px;background:var(--sunk)}

/* ═════════ Stil „Data Farm“: schwarz, Gold, Monospace ═════════ */
:root{
  --bg:#0b0b0a; --surface:#121211; --raise:#171715; --sunk:#0e0e0d; --line:#232320; --line2:#2e2d29; --fg:#e9e4d8; --muted:#8c877b;
  --accent:#e3b341; --accent-fg:#141310; --pos:#3fbf7f; --neg:#e5534b; --warn:#e8913a; --fill:rgba(227,179,65,.12);
  --pos-bg:rgba(63,191,127,.09); --neg-bg:rgba(229,83,75,.09); --warn-bg:rgba(232,145,58,.12);
  --f-display:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
  --f-body:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
  --f-mono:"JetBrains Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
}
body{background:var(--bg);font-size:13px;letter-spacing:-.005em}
.top{background:rgba(11,11,10,.94);border-bottom:1px solid var(--line)}
.brand{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fg)}
.brand i{width:14px;height:14px;border-radius:2px;background:var(--accent);box-shadow:0 0 12px rgba(227,179,65,.45)}
.nav{background:transparent;gap:4px;padding:0}
.nav button{font:600 11.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:6px 11px;border-radius:4px;color:var(--muted)}
.nav button svg{display:none}
.nav button[aria-current=true]{background:rgba(227,179,65,.12);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(227,179,65,.35)}
.nav button:hover{color:var(--fg)}
@media (max-width:1060px){ .nav button svg{display:block} .nav button span{display:none} }
@media (max-width:820px){ .nav button{font-size:9.5px;letter-spacing:.04em} }
h2,.section h2,.section-h h2{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg)}
.panel,.kpi,.df-c,.drw,.pc,.set-sec{border-radius:4px!important}
.panel{background:var(--surface);border-color:var(--line)}
.kpi .l,.td-l,.df-s small,.mc-big .td-l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kpi .v,.td-pl b,.mc-big b{font-weight:600;letter-spacing:-.02em}
.btn{border-radius:3px;font-size:12px;letter-spacing:.02em}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip{border-radius:3px;font-size:11px;letter-spacing:.02em}
.chip.good{color:var(--pos)} .chip.warn{color:var(--accent);background:rgba(227,179,65,.1)}
.pill{border-radius:3px;font-size:11px}
input,select{border-radius:3px;background:var(--sunk)}
.tgl[aria-checked=true]{background:var(--accent)}
.switch{border-radius:4px}
th{font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.hint{color:var(--muted)}
.content.wide{max-width:none}
/* Chart */
.cv{padding-top:12px}
.cv-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 0 12px;border-bottom:1px solid var(--line);margin-bottom:10px}
.cv-f{display:flex;align-items:center;gap:6px}
.cv-f>span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cv-f select,.cv-f input{padding:4px 8px;font:12px var(--f-mono)}
.cv-f .ibtn{width:26px;height:26px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:3px;font-size:15px;line-height:1}
.cv-tf{display:flex;gap:2px}
.cv-tf button{border:0;background:transparent;color:var(--muted);font:600 12px var(--f-mono);padding:4px 8px;border-radius:3px}
.cv-tf button[aria-pressed=true]{background:rgba(227,179,65,.14);color:var(--accent)}
.cv-info{font-size:12px;color:var(--muted)} .cv-info b{color:var(--fg)} .cv-info b.acc,.cv-info .live{color:var(--accent)}
.cv-hint{margin-left:auto;font-size:11px;color:var(--muted)}
.cv-main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px}
.cv-wrap{position:relative;height:calc(100vh - 210px);min-height:440px;border:1px solid var(--line);background:var(--bg);border-radius:3px;overflow:hidden}
.cv-wrap canvas{display:block;cursor:crosshair;touch-action:none;outline:none}
.cv-ohlc{position:absolute;left:10px;top:8px;font-size:11.5px;color:var(--muted);pointer-events:none;background:rgba(11,11,10,.7);padding:2px 6px;border-radius:2px}
.cv-ohlc b{color:var(--fg);margin-right:6px} .cv-ohlc span{color:var(--fg)}
.cv-msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--surface);border:1px solid var(--line);padding:12px 16px;border-radius:3px;color:var(--muted);max-width:70%;text-align:center}
.cv-side{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 210px);overflow:auto}
.cv-sec{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.cv-sec h3{margin:0 0 8px;font:700 10.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.cv-lay{display:flex;flex-direction:column;gap:2px}
.cv-li{display:grid;grid-template-columns:16px 8px 1fr auto;gap:8px;align-items:center;font-size:12px;padding:3px 0;cursor:pointer}
.cv-li input{accent-color:var(--accent);margin:0}
.cv-li i{width:8px;height:8px;border-radius:50%}
.cv-li b{font-size:11px;color:var(--muted);font-weight:500}
.cv-lb{display:flex;gap:6px;margin-top:8px} .cv-lb .btn{padding:3px 8px;font-size:11px}
.cv-ik{font-weight:700;color:var(--accent);margin-bottom:8px;font-size:12.5px}
.cv-kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:12px}
.cv-kv dt{color:var(--muted)} .cv-kv dd{margin:0;text-align:right;word-break:break-word}
.cv-raw pre{font-size:10.5px;white-space:pre-wrap;color:var(--muted);max-height:220px;overflow:auto;margin:6px 0 0}
@media (max-width:820px){ .nav{overflow-x:auto;grid-template-columns:repeat(7,minmax(52px,1fr))} }
@media (max-width:980px){ .cv-main{grid-template-columns:1fr} .cv-side{max-height:none} .cv-hint{display:none} .cv-wrap{height:60vh} }
.ck-more{margin-top:18px}
.ck-more>summary{cursor:pointer;color:var(--muted);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;padding:10px 0;border-top:1px solid var(--line);list-style:none}
.ck-more>summary::before{content:"▸ ";color:var(--accent)} .ck-more[open]>summary::before{content:"▾ "}
.ln-tabs{align-items:center;flex-wrap:wrap}
.ln-det{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 4px 0 14px;padding-left:14px;border-left:1px solid var(--line)}
.ln-tabs button.sm{font-size:12px;padding:6px 9px}
.lo-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.lo-st{display:flex;gap:10px;align-items:center}
.lo-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:14px}
.lo-c{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px}
.lo-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lo-h h3{margin:0;font:700 10.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.lnk{background:none;border:0;color:var(--muted);font:11.5px var(--f-mono);padding:0} .lnk:hover{color:var(--accent)}
.lo-l{display:flex;flex-direction:column;gap:6px}
.lo-r{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px} .lo-r>span:first-child{margin-right:auto}
.lo-log{display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.5}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = v => v == null || !isFinite(v) ? "–" : (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("de-DE", {maximumFractionDigits: 0});
const usd2 = v => v == null || !isFinite(v) ? "–" : (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const px = v => v == null ? "–" : Number(v).toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = v => v == null || !isFinite(v) ? "–" : v.toFixed(1).replace(".", ",") + " %";
const num2 = v => v == null || !isFinite(v) ? "–" : v.toFixed(2).replace(".", ",");
const cls = v => v > 0 ? "pos" : v < 0 ? "neg" : "";
const tm = ts => new Date(ts * 1000).toLocaleTimeString("de-DE", {hour: "2-digit", minute: "2-digit"});
const dtm = ts => new Date(ts * 1000).toLocaleString("de-DE", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});

// Reiter in der Adresse merken, ohne neue Verlaufseinträge (sonst darf sich das App-Fenster nicht schließen)
const setHash = t => { try { history.replaceState(null, "", "#" + t); } catch (e) { location.hash = t; } };
let S = null, TAB = "cockpit", pendingKey = "", seenPending = new Set(), firstLoad = true, settingsDirty = false;

async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json", "X-Requested-With": "fvg"}, body: JSON.stringify(body)};
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !path.startsWith("/api/login")) { showLogin(); throw new Error("Bitte anmelden"); }
  if (!r.ok) throw new Error(j.error || "Fehler " + r.status);
  return j;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200);
}
async function act(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg); await refresh(); return r; }
  catch (e) { toast(e.message); }
}

function copyText(txt, label) {
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast((label || "Text") + " kopiert"); } catch (e) { toast("Bitte manuell kopieren"); } ta.remove(); };
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast((label || "Text") + " kopiert"), fallback); else fallback();
}


async function serviceSet(on) {
  document.body.insertAdjacentHTML("beforeend", `<div id="svcOv" style="position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px">
    <div style="text-align:center;max-width:420px;display:flex;flex-direction:column;gap:10px;align-items:center">
      <h2 style="font-size:20px" id="svcT2">${on ? "Dienst wird eingerichtet …" : "Dienst wird entfernt …"}</h2>
      <p class="hint" id="svcMsg" style="margin:0">Bitte die Windows-Rückfrage nach Administratorrechten mit „Ja“ bestätigen.</p><div id="svcAct"></div></div></div>`);
  const msg = (t, m, close) => { $("#svcT2").textContent = t; $("#svcMsg").innerHTML = m;
    $("#svcAct").innerHTML = close ? '<button class="btn" id="svcClose">Schließen</button>' : ""; if (close) $("#svcClose").onclick = () => { $("#svcOv").remove(); render(true); }; };
  try { await api("/api/service", {on}); }
  catch (e) { return msg(on ? "Einrichten fehlgeschlagen" : "Entfernen fehlgeschlagen", esc(e.message), true); }
  if (!on) { S = await api("/api/state"); return msg("Dienst entfernt", "FVG Trader startet nicht mehr automatisch beim Hochfahren. Die App läuft weiter, bis du sie beendest oder der PC neu startet. Für den Start nach der Anmeldung kannst du „Mit Windows starten“ wieder einschalten.", true); }
  msg("Dienst eingerichtet", "Der Dienst startet jetzt und übernimmt. Das dauert ein paar Sekunden …");
  const t0 = Date.now();
  while (Date.now() - t0 < 90000) {
    await new Promise(r => setTimeout(r, 2000));
    try { const v = await fetch("/api/version", {cache: "no-store"}).then(r => r.json()); if (v.service) { location.reload(); return; } } catch (e) { /* Übergabe läuft */ }
  }
  msg("Dienst eingerichtet", "Er startet spätestens beim nächsten Hochfahren. Falls die App gerade nicht reagiert: Seite neu laden.", true);
}
async function runUpdate(doIt) {
  const before = S && S.version;
  document.body.insertAdjacentHTML("beforeend", `<div id="updOv" style="position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px">
    <div style="text-align:center;max-width:380px;display:flex;flex-direction:column;gap:10px;align-items:center">
      <h2 style="font-size:20px" id="updT">Update wird geladen …</h2>
      <p class="hint" id="updMsg" style="margin:0">Die neue Version wird heruntergeladen und geprüft.</p>
      <div id="updAct"></div></div></div>`);
  const msg = (t, m, act) => { $("#updT").textContent = t; $("#updMsg").innerHTML = m; $("#updAct").innerHTML = act || ""; };
  let res;
  try { res = await doIt(); } catch (e) {
    msg("Update fehlgeschlagen", esc(e.message), '<button class="btn" id="updClose">Schließen</button>');
    $("#updClose").onclick = () => $("#updOv").remove(); return;
  }
  const target = res && res.version;
  msg("Neustart …", `Version <b>${esc(target || "neu")}</b> ist installiert. FVG Trader startet neu, das dauert ein paar Sekunden.`);
  const t0 = Date.now();
  let kills = 0;
  const poll = async () => {
    const secs = (Date.now() - t0) / 1000;
    try {
      const r = await fetch("/api/state", {cache: "no-store"});
      if (r.status === 401) { location.reload(); return; }
      if (r.ok) {
        const j = await r.json();
        if (j.version !== before) { location.reload(); return; }
        if (secs > 12 && kills < 5) {   // eine alte Instanz antwortet noch: beenden, die neue übernimmt
          kills++;
          msg("Räume auf …", "Eine ältere FVG-Trader-Instanz läuft noch im Hintergrund und wird beendet.");
          try { await fetch("/api/shutdown", {method: "POST", headers: {"X-Requested-With": "fvg", "Content-Type": "application/json"}, body: "{}"}); } catch (e) {}
        }
      }
    } catch (e) {}
    if (secs > 30) {
      msg("Update installiert ✓", `Version <b>${esc(target || "neu")}</b> ist installiert.<br>Schließ dieses Fenster und starte FVG Trader über das <b>Desktop-Symbol</b>.`,
        '<button class="btn" id="updRetry">Erneut verbinden</button>');
      $("#updRetry").onclick = () => location.reload(); return;
    }
    setTimeout(poll, 1000);
  };
  setTimeout(poll, 2000);
}
async function startupUpdatePrompt() {
  if (!S.config.update_url) return;
  let u;
  try { u = await api("/api/update/check", {}); } catch (e) { return; }
  if (!u.available) return;
  try { if (sessionStorage.getItem("fvg-upd-asked") === u.version) return; sessionStorage.setItem("fvg-upd-asked", u.version); } catch (e) {}
  document.body.insertAdjacentHTML("beforeend", `<div id="updAsk" role="dialog" aria-modal="true" aria-labelledby="updAskT"
    style="position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.55);display:grid;place-items:center;padding:16px">
    <div class="panel" style="max-width:400px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)">
      <h2 id="updAskT" style="font-size:19px">Update verfügbar</h2>
      <p style="margin:0">Version <b>${esc(u.version)}</b> ist da (installiert: ${esc(S.version)}).${u.notes ? `<br><span class="hint">${esc(u.notes)}</span>` : ""}</p>
      <p class="hint" style="margin:0">Jetzt aktualisieren? Deine Einstellungen und Trades bleiben erhalten.</p>
      <div class="actions"><button class="btn primary" id="updYes">Ja, jetzt aktualisieren</button><button class="btn" id="updNo">Nein</button></div>
    </div></div>`);
  $("#updYes").focus();
  $("#updNo").onclick = () => $("#updAsk").remove();
  $("#updYes").onclick = () => { $("#updAsk").remove(); runUpdate(() => api("/api/update/apply", {})); };
}

/* ───────── Login ───────── */
async function showLogin() {
  const a = await fetch("/api/auth").then(r => r.json());
  const setup = !a.has_password;
  $("#app").innerHTML = `<div class="login"><form id="lf">
    <h1>FVG Trader</h1>
    <p class="hint">${setup ? "Lege ein Passwort fest. Es schützt die App, sobald sie über das Internet erreichbar ist." : "Melde dich an, um deinen Bot zu steuern."}</p>
    <input id="pw" type="password" autocomplete="${setup ? "new-password" : "current-password"}" placeholder="Passwort${setup ? " (mind. 8 Zeichen)" : ""}" required>
    <button class="btn primary" type="submit">${setup ? "Passwort festlegen" : "Anmelden"}</button>
    <p id="lerr" class="err-msg" hidden></p></form></div>`;
  $("#pw").focus();
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    try { await api(setup ? "/api/setup" : "/api/login", {password: $("#pw").value}); start(); }
    catch (err) { $("#lerr").textContent = err.message; $("#lerr").hidden = false; }
  };
}

/* ───────── Gerüst ───────── */
const NAV = [
  ["cockpit", "Cockpit", '<path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15l4.5-4.5"/><circle cx="12" cy="15" r="1.2"/>'],
  ["chart", "Chart", '<path d="M4 19h16"/><path d="M7 15V9M7 9V7M12 13V6M12 6V4M17 16v-5M17 11V9"/><rect x="5.5" y="9" width="3" height="5" rx=".5"/><rect x="10.5" y="6" width="3" height="6" rx=".5"/><rect x="15.5" y="11" width="3" height="4" rx=".5"/>'],
  ["calendar", "Kalender", '<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/>'],
  ["stats", "Statistik", '<path d="M5 19v-7M12 19V5M19 19v-10"/>'],
  ["challenge", "Fremdkapital", '<path d="M3 8.5 12 4l9 4.5"/><path d="M5 10v7M9.5 10v7M14.5 10v7M19 10v7M3.5 20h17"/>'],
  ["learn", "Lernmodul", '<path d="M12 3.5l2.3 4.8 5.2.7-3.8 3.7.9 5.2L12 15.4 7.4 17.9l.9-5.2-3.8-3.7 5.2-.7z"/>'],
  ["settings", "Einstellungen", '<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>'],
];
const icon = d => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
function shell() {
  $("#app").innerHTML = `
  <header class="top"><div class="wrap bar">
    <div class="brand"><i aria-hidden="true"></i>FVG Trader</div>
    <nav class="nav" aria-label="Bereiche">${NAV.map(([k, l, d]) => `<button type="button" data-tab="${k}" aria-current="${k === TAB}" title="${l}">${icon(d)}<span>${l}</span><em>${{challenge: "Kapital", learn: "Lernen", settings: "Mehr"}[k] || l}</em></button>`).join("")}</nav>
    <div class="bar-r">
      <span class="dot" id="pDot" title="TradingView-Verbindung" hidden></span>
      <div class="switch"><b id="autoLbl">Auto</b><button class="tgl" id="autoT" role="switch" aria-checked="false" aria-labelledby="autoLbl"></button></div>
      <button class="btn danger" id="kill">Notaus</button>
    </div>
  </div></header>
  <div class="content wrap">
    <div class="status"><span class="pill" id="pTv"></span><span class="pill" id="pBroker"></span><span class="pill" id="pSess"></span><span class="pill news-pill" id="pNews" hidden></span><span class="hint" id="pVer"></span></div>
    <div id="banner"></div><main id="main"></main>
  </div>`;
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { if ($("#dayDrw")) closeDay(); TAB = b.dataset.tab; setHash(TAB); pendingKey = ""; settingsDirty = false;
    window.scrollTo(0, 0); render(true); });
  $("#autoT").onclick = () => act(() => api("/api/config", {auto_mode: !S.config.auto_mode}),
    !S.config.auto_mode ? "Auto-Modus an: Signale werden direkt ausgeführt" : "Auto-Modus aus: Signale kommen als Vorschlag");
  $("#kill").onclick = () => confirmBtn($("#kill"), "Wirklich alles schließen?", () =>
    act(() => api("/api/flatten", {}), "Alles geschlossen, Handel pausiert"));
}
let ARMED = {key: null, until: 0};
const armed = key => ARMED.key === key && Date.now() < ARMED.until;
function confirmBtn(btn, question, fn) {
  const key = btn.dataset.key || btn.id;
  if (!btn.dataset.orig) btn.dataset.orig = btn.textContent;
  if (armed(key)) { ARMED = {key: null, until: 0}; btn.textContent = btn.dataset.orig; fn(); return; }
  ARMED = {key, until: Date.now() + 4000}; btn.textContent = question;
  setTimeout(() => { if (ARMED.key === key && Date.now() >= ARMED.until) { ARMED = {key: null, until: 0}; } if (!armed(key) && document.body.contains(btn)) btn.textContent = btn.dataset.orig; }, 4100);
}

function header() {
  const c = S.config, age = S.tv.last_msg ? (Date.now() / 1000 - S.tv.last_msg) : null;
  const tvState = age == null ? ["bad", "TradingView: noch kein Signal"] : age < 1260 ? ["ok", "TradingView verbunden · " + tm(S.tv.last_msg)] : ["warn", "TradingView: letzte Nachricht " + dtm(S.tv.last_msg)];
  $("#pTv").innerHTML = `<span class="dot ${tvState[0]}"></span>${tvState[1]}`;
  $("#pDot").className = "dot " + tvState[0]; $("#pDot").title = tvState[1];
  $("#pVer").textContent = "Version " + S.version;
  $("#pBroker").innerHTML = `<span class="dot ${S.broker.ok ? "ok" : "bad"}"></span>${esc(S.broker.label)}${S.broker.name === "tradovate" ? " " + (c.tradovate.env === "live" ? "LIVE" : "Demo") : ""}`;
  $("#pBroker").title = S.broker.status;
  $("#pSess").innerHTML = `<span class="dot ${S.session_open ? "ok" : ""}"></span>NY ${S.now_ny} · ${S.session_open ? esc(S.session_name) : "keine Session"}`;
  $("#autoT").setAttribute("aria-checked", c.auto_mode);
  $("#banner").innerHTML = c.paused ? `<div class="banner">Handel pausiert. Neue Signale werden blockiert. <button class="btn" id="resume" style="margin-left:8px">Fortsetzen</button></div>`
    : (S.broker.name === "tradovate" && c.tradovate.env === "live" ? `<div class="banner">LIVE-Konto aktiv: Orders gehen mit echtem Geld an Tradovate.</div>` : "")
    + (c.hook_confirmed && S.hook_url && !S.hook_confirmed ? `<div class="banner">Deine Webhook-Adresse hat sich nach dem Neustart geändert. Bitte im TradingView-Alert ersetzen:
        <div class="copyrow" style="margin-top:8px"><div class="code" id="newHook">${esc(S.hook_url)}</div><button class="btn" id="cpNew">Kopieren</button><button class="btn primary" id="okNew">Erledigt</button></div></div>` : "")

/* ───────── Tageszusammenfassung + Gesundheits-Check ───────── */
let HC_OPEN = false;
function todayCard() {
  const s = S.summary, ds = s.daystop || {}, total = s.realized + s.upnl;
  const goal = ds.goal || S.config.risk.daily_profit_stop || 0, loss = ds.loss || S.config.risk.max_daily_loss || 0;
  let meter = "";
  if (goal > 0 || loss > 0) {
    const lo = loss > 0 ? -loss : Math.min(0, total), hi = goal > 0 ? goal : Math.max(1, total), span = hi - lo || 1;
    const p0 = Math.max(0, Math.min(100, -lo / span * 100)), pv = Math.max(0, Math.min(100, (total - lo) / span * 100));
    meter = `<div class="td-m" title="Tages-Stopp: ${loss > 0 ? "Verlust " + usd(-loss) : "kein Verlust-Stopp"} · ${goal > 0 ? "Ziel " + usd(goal) : "kein Tagesziel"}">
      <div class="td-mt"><i class="${total >= 0 ? "p" : "n"}" style="left:${Math.min(p0, pv)}%;width:${Math.abs(pv - p0)}%"></i><b style="left:${p0}%"></b></div>
      <div class="td-ml"><span>${loss > 0 ? "Stopp bei " + usd(-loss) : ""}</span><span>${goal > 0 ? "Tagesziel " + usd(goal) : ""}</span></div></div>`;
  }
  const st = S.config.paused ? ["bad", "Pausiert"] : ds.hit ? ["warn", ds.hit === "ziel" ? "Tagesziel erreicht" : "Tages-Stopp"] : S.news_pause ? ["warn", "News-Pause"]
    : !S.session_open ? ["mute", "Wartet auf Session"] : S.config.auto_mode ? ["good", "Handelt automatisch"] : ["", "Schickt Vorschläge"];
  const nn = S.news_next, ch = S.challenge;
  const blocked = Object.entries(s.blocked || {}).sort((a, b) => b[1] - a[1]);
  const H = S.health || [], nBad = H.filter(x => x.status === "bad").length, nWarn = H.filter(x => x.status === "warn").length;
  const cell = (l, v, sub, c = "") => `<div class="td-c"><span class="td-l">${l}</span><b class="mono ${c}">${v}</b>${sub ? `<small>${sub}</small>` : ""}</div>`;
  return `<div class="td-top">
      <div class="td-pl"><span class="td-l">Heute</span><b class="${cls(total)}">${sUsd(total)}</b>
        <small>${s.n ? `realisiert ${sUsd(s.realized)}` : "noch kein Trade geschlossen"}${s.open ? ` · offen ${sUsd(s.upnl)}` : ""}${s.own_n ? ` · eigene ${sUsd(s.own_pnl)}` : ""}</small></div>
      <div class="td-cs">
        ${cell("Trades", `${s.n}${s.open ? " + " + s.open : ""}`, s.n ? `${s.wins} Gewinner · ${s.losses} Verlierer` : `max. ${S.config.risk.max_trades_day} pro Tag`)}
        ${cell("Ergebnis in R", (s.r > 0 ? "+" : "") + num2(s.r), s.n ? `Ø ${num2(s.r / s.n)} R pro Trade` : "", cls(s.r))}
        ${cell("Signale", s.signals, s.signals ? `${s.executed} genommen · ${s.signals - s.executed} nicht` : "heute noch keins")}
        ${cell("Kontostand", S.balance == null ? "–" : usd(S.balance), esc(S.broker.label))}
      </div>
    </div>
    ${meter}
    <div class="td-chips">
      <span class="chip ${st[0]}"><span class="dot ${st[0] === "good" ? "ok" : st[0] === "mute" ? "" : st[0]}"></span>${st[1]}</span>
      ${nn ? `<span class="chip" title="${esc(nn.title)}">Nächste News ${tm(nn.ts / 1000)} · ${esc(nn.title.length > 28 ? nn.title.slice(0, 27) + "…" : nn.title)}</span>` : ""}
      ${blocked.length ? `<span class="chip mute">Nicht genommen: ${blocked.map(([k, v]) => `${esc(k)} ${v}`).join(" · ")}</span>` : ""}
    </div>
    <div class="hc">
      <button type="button" class="hc-sum" id="hcT" aria-expanded="${HC_OPEN}">
        <span class="hc-dots">${H.map(x => `<span class="dot ${x.status === "off" ? "" : x.status}" title="${esc(x.label)}: ${esc(x.text)}"></span>`).join("")}</span>
        <span>${nBad ? `<b class="neg">${nBad} Problem${nBad > 1 ? "e" : ""}</b>` : nWarn ? `<b style="color:var(--warn)">${nWarn} Hinweis${nWarn > 1 ? "e" : ""}</b>` : `<b class="pos">Alles in Ordnung</b>`} · Gesundheits-Check</span>
        <span class="hc-ch">${HC_OPEN ? "weniger" : "Details"}</span></button>
      ${HC_OPEN ? `<div class="hc-list">${H.map(x => `<div class="hc-i"><span class="dot ${x.status === "off" ? "" : x.status}"></span><b>${esc(x.label)}</b><span>${esc(x.text)}</span></div>`).join("")}</div>` : ""}
    </div>`;
}

/* ───────── Timeline: was der Bot heute entschieden hat ───────── */
function tlItems(items, withDate) {
  const chip = {"ausgeführt": "good", "offen": "", "abgelehnt": "mute", "verfallen": "mute", "ersetzt": "mute", "blockiert": "warn", "fehler": "bad"};
  return items.slice().reverse().map(s => {
    const p = s.pos, sh = s.shadow;
    let what = "", out = "", kind = s.status === "ausgeführt" ? "in" : s.status === "blockiert" ? "bl" : "mu";
    if (s.status === "ausgeführt") {
      what = `Eingestiegen ${s.qty}× @ ${px(s.entry)} · Stop ${px(s.sl)}${s.tp ? " · Ziel " + px(s.tp) : ""}${s.mgmt ? ` · Ausstieg ${esc(s.mgmt)}` : ""}`;
      if (p && p.status === "geschlossen") out = `<b class="mono ${cls(p.pnl)}">${sUsd(p.pnl)}</b><small>${p.r != null ? (p.r > 0 ? "+" : "") + num2(p.r) + " R · " : ""}${esc(p.reason || "")}</small>`;
      else if (p) out = `<span class="chip">läuft</span>`;
    } else {
      what = esc(s.reason || s.status);
      if (sh && sh.status === "geschlossen" && sh.r != null) {
        const helped = sh.r < 0;
        out = `<b class="mono ${helped ? "pos" : "neg"}" title="${helped ? "Der Filter hat einen Verlust verhindert" : "Der Filter hat einen Gewinn verhindert"}">hätte ${(sh.r > 0 ? "+" : "") + num2(sh.r)} R</b><small>${helped ? "gut, dass nicht" : "verpasst"}</small>`;
      } else if (sh) out = `<small class="hint">Schatten läuft</small>`;
    }
    const flags = (s.flags || []).filter(f => !/^Ausstieg /.test(f));
    return `<div class="tl-i ${kind}"><time class="mono">${withDate ? dtm(s.ts) : tm(s.ts)}</time><span class="tl-d"></span>
      <div class="tl-c"><div class="tl-h"><b class="side ${s.side}" style="font-size:12px">${s.side === "long" ? "L" : "S"}</b> ${esc(s.root)} <span class="chip">${esc(s.setup)}</span>
        <span class="chip ${chip[s.status] ?? "mute"}">${s.status === "blockiert" && s.cat ? "nicht genommen · " + esc(s.cat) : esc(s.status)}</span>${s.is_test ? ' <span class="chip mute">Test</span>' : ""}</div>
        <div class="tl-w">${what}${flags.length ? `<span class="hint"> · ${esc(flags.join(" · "))}</span>` : ""}</div></div>
      <div class="tl-o">${out}</div></div>`;
  }).join("");
}
function timelinePanel() {
  const tl = S.timeline || {items: []};
  if (tl.items.length) return `<div class="tl">${tlItems(tl.items)}</div>`;
  const old = (S.signals || []).slice(0, 8);
  return `<p class="hint" style="margin:0 0 8px">Heute noch keine Signale. ${S.session_open ? "Der Bot wartet auf das nächste Setup." : "Gerade läuft keine Session."}</p>
    ${old.length ? `<details class="tl-old"><summary class="hint">Letzte Signale der Vortage</summary><div class="tl">${tlItems(old.slice().reverse(), true)}</div></details>` : ""}`;
}

function journalBox(t) {
  const shots = (() => { try { return JSON.parse(t.shots || "[]"); } catch (e) { return []; } })();
  return `<div class="jr" data-jr="${t.id}">
    <textarea class="jr-t" data-id="${t.id}" rows="2" placeholder="Notiz zum Trade: Warum rein? Was lief gut, was nicht? (speichert automatisch)">${esc(t.journal || "")}</textarea>
    <div class="jr-s">${shots.map(n => `<span class="jr-img"><img src="/api/shot/${n}" alt="Screenshot" loading="lazy" data-full="/api/shot/${n}"><button type="button" class="jr-x" data-id="${t.id}" data-n="${n}" aria-label="Bild löschen">×</button></span>`).join("")}
      ${shots.length < 6 ? `<label class="jr-add" title="Bild hinzufügen (oder Screenshot mit Strg+V ins Notizfeld einfügen)">+ Bild<input type="file" accept="image/png,image/jpeg,image/webp" data-id="${t.id}" hidden></label>` : ""}</div>
  </div>`;
}
async function jrUpload(id, file) {
  if (!file || !/^image\/(png|jpeg|webp)$/.test(file.type)) return toast("Nur PNG-, JPG- oder WEBP-Bilder");
  if (file.size > 6e6) return toast("Bild ist größer als 6 MB");
  const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  try { await api(`/api/trade/${id}/shot`, {data}); toast("Bild gespeichert"); openDay(CAL.sel); } catch (e) { toast(e.message); }
}
function jrBind(root) {
  root.querySelectorAll(".jr-t").forEach(ta => {
    let last = ta.value;
    const save = async () => { if (ta.value === last) return; last = ta.value; try { await api(`/api/trade/${ta.dataset.id}/journal`, {text: ta.value});
      const t = (CAL.dayTrades || []).find(x => x.id === ta.dataset.id); if (t) t.journal = ta.value; toast("Notiz gespeichert"); } catch (e) { toast(e.message); } };
    ta.addEventListener("blur", save);
    ta.addEventListener("paste", e => { const f = [...(e.clipboardData || {}).files || []].find(x => x.type.startsWith("image/")); if (f) { e.preventDefault(); save(); jrUpload(ta.dataset.id, f); } });
  });
  root.querySelectorAll(".jr-add input").forEach(inp => inp.onchange = () => jrUpload(inp.dataset.id, inp.files[0]));
  root.querySelectorAll(".jr-x").forEach(b => b.onclick = async () => { try { await api(`/api/trade/${b.dataset.id}/shot/delete`, {name: b.dataset.n}); openDay(CAL.sel); } catch (e) { toast(e.message); } });
  root.querySelectorAll(".jr-img img").forEach(img => img.onclick = () => { const c = modal(`<img src="${img.dataset.full}" alt="Screenshot" style="max-width:100%;max-height:78vh;display:block;margin:0 auto;border-radius:8px">
    <div class="inline" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-close>Schließen</button></div>`); $("#mdl [data-close]").onclick = c; });
}

/* ───────── Nachverfolgung früher Ausstiege ───────── */
function ghostLine(t) {
  if (!t.ghost_status || !t.initial_sl) return "";
  const d = t.side === "long" ? 1 : -1, r0 = Math.abs(t.entry - t.initial_sl) || 1e-9, ar = (t.exit - t.entry) * d / r0;
  if (t.ghost_status !== "fertig") return `<div class="gh"><span class="dot"></span><span>${esc(t.exit_cat)} · wird weiter verfolgt: Was wäre ohne den frühen Ausstieg passiert?</span></div>`;
  const diff = ar - t.ghost_r, good = diff > 0.05, bad = diff < -0.05;
  return `<div class="gh ${good ? "g" : bad ? "b" : ""}"><span class="dot ${good ? "ok" : bad ? "bad" : ""}"></span><span><b>${esc(t.exit_cat)}:</b> gehalten hätte er ${t.ghost_how === "Ziel" ? "das <b>Ziel</b> erreicht" : t.ghost_how === "Stop" ? "den <b>Stop</b> erreicht" : "bis Sessionende"} bei <b class="mono ${cls(t.ghost_r)}">${t.ghost_r > 0 ? "+" : ""}${num2(t.ghost_r)} R</b> statt ${ar > 0 ? "+" : ""}${num2(ar)} R → <b>${good ? "gerettet" : bad ? "verpasst" : "kein Unterschied"}${good || bad ? " " + num2(Math.abs(diff)) + " R" : ""}</b></span></div>`;
}
const EX = {data: null, at: 0};
async function exitPanel() {

    ${G.length ? `<table><thead><tr><th class="t">Ausstieg</th><th>Trades</th><th>Ø tatsächlich</th><th>Ø gehalten</th><th>Unterschied</th><th class="t">Gehalten wäre …</th><th class="t">Fazit</th></tr></thead><tbody>${G.map(([k, g]) =>
      `<tr><td class="t">${esc(k)}</td><td>${g.n}</td><td class="${cls(g.actual)}">${num2(g.actual)} R</td><td class="${cls(g.held)}">${num2(g.held)} R</td><td class="${cls(g.diff)}"><b>${g.diff > 0 ? "+" : ""}${num2(g.diff)} R</b></td>

      <p class="hint" style="margin:8px 0 0">Positiv = der frühe Ausstieg hat Geld gespart. Kosten Smart-Ausstieg/Smart-BE oder TradingView-Exits über viele Trades nachweislich Geld (in beiden Zeit-Hälften), schaltet der Bot sie selbst ab. ${d.follow_tv ? "" : "<b>TradingView-Exits werden zurzeit nicht befolgt.</b>"}</p>`

}

async function cvLoad(reset) {
  if (CV.busy) return;
  CV.busy = true;
  const keepRight = CV.v && CV.data && CV.v.i1 >= CV.data.candles.length - 0.5;
  try {
    const d = await api(`/api/chartview/${CV.fam}/${CV.day}/${CV.tf}`);
    const same = CV.data && CV.data.day === d.day && CV.data.tf === d.tf && CV.data.fam === d.fam;
    CV.data = d; CV.err = null;

  const d = CV.data;
  if (d) {

    $("#cvFam").innerHTML = d.fams.map(f => `<option ${d.fam === f ? "selected" : ""}>${f}</option>`).join("");
    const ev = Object.entries(d.counts).filter(([k]) => !["zigzag", "sessions"].includes(k)).reduce((a, [, v]) => a + v, 0);
    $("#cvInfo").innerHTML = `<b>${d.candles.length}</b> ${d.tf < 60 ? d.tf + "m" : d.tf / 60 + "h"}-Kerzen · <b>${ev}</b> Ereignisse · <b class="${d.counts.trades ? "acc" : ""}">${d.counts.trades}</b> Trades${d.live ? ' · <span class="live">● live</span>' : ""}`;

  }

  msg.hidden = !(CV.err || (d && (!d.candles.length || d.note)));
  msg.textContent = CV.err || (d && !d.candles.length ? "Für diesen Tag sind keine Kerzen gespeichert." : d && d.note ? d.note : "");
  cvLayersPanel();
  cvResize(); cvDraw();
  clearTimeout(CV.timer);
  if (d && d.live) CV.timer = setTimeout(() => { if (TAB === "chart" && !document.hidden) cvLoad(false); }, ["localhost", "127.0.0.1"].includes(location.hostname) ? 20000 : 60000);
}

function cvResetView() {
  const n = CV.data ? CV.data.candles.length : 0;
  const narrow = innerWidth < 700;
  const show = Math.min(n, narrow ? 70 : CV.data && CV.data.tf === 1 ? 300 : CV.data && CV.data.tf >= 60 ? 160 : n);
  CV.v = {i1: n + 2, i0: n + 2 - Math.max(20, show + 2), y: null};
}

function cvBind() {
  $("#cvFam").onchange = e => { CV.fam = e.target.value; CV.day = "last"; CV.sel = null; cvLoad(true); };
  $("#cvDay").onchange = e => { if (e.target.value) { CV.day = e.target.value; CV.sel = null; cvLoad(true); } };
  $("#cvPrev").onclick = () => cvShiftDay(-1);
  $("#cvNext").onclick = () => cvShiftDay(1);
  document.querySelectorAll("[data-tf]").forEach(b => b.onclick = () => { CV.tf = +b.dataset.tf; CV.sel = null; cvLoad(true); });
  const cv = $("#cvC");
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  let drag = null;
  cv.addEventListener("wheel", e => {
    e.preventDefault();
    if (!CV.v || !CV.g) return;
    const [x] = pos(e);
    const f = Math.pow(1.0015, e.deltaY);   // gleichmäßig, auch bei Touchpads
    const at = CV.v.i0 + Math.min(x, CV.g.pw) / CV.g.pw * (CV.v.i1 - CV.v.i0);
    let w = (CV.v.i1 - CV.v.i0) * f;
    const n = CV.data.candles.length;
    w = Math.max(12, Math.min(Math.max(40, n * 1.5), w));
    const k = (at - CV.v.i0) / (CV.v.i1 - CV.v.i0);
    CV.v.i0 = at - k * w; CV.v.i1 = CV.v.i0 + w;
    cvClamp(); cvDraw();
  }, {passive: false});
  cv.addEventListener("pointerdown", e => {
    if (!CV.v || !CV.g) return;
    const [x, y] = pos(e);
    cv.setPointerCapture(e.pointerId);
    drag = {x, y, i0: CV.v.i0, i1: CV.v.i1, axis: x > CV.g.pw, moved: false, yr: CV.g.yr.slice()};
  });
  cv.addEventListener("pointermove", e => {
    const [x, y] = pos(e);
    if (drag && CV.g) {
      const dx = x - drag.x, dy = y - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
      if (drag.axis) {   // Preisachse ziehen = Höhe skalieren
        const mid = (drag.yr[0] + drag.yr[1]) / 2, half = (drag.yr[1] - drag.yr[0]) / 2 * Math.exp(dy / 150);
        CV.v.y = [mid - half, mid + half];
      } else {
        const per = (drag.i1 - drag.i0) / CV.g.pw;
        CV.v.i0 = drag.i0 - dx * per; CV.v.i1 = drag.i1 - dx * per;
        if (CV.v.y) { const ppx = (drag.yr[1] - drag.yr[0]) / CV.g.ph; CV.v.y = [drag.yr[0] + dy * ppx, drag.yr[1] + dy * ppx]; }
        cvClamp();
      }
      CV.hover = null; cvDraw(); return;
    }
    CV.hover = [x, y]; cvDraw();
  });
  cv.addEventListener("pointerup", e => {
    const [x, y] = pos(e);
    if (drag && !drag.moved && !drag.axis) cvPick(x, y);
    drag = null;
  });
  cv.addEventListener("pointerleave", () => { CV.hover = null; cvDraw(); });
  cv.addEventListener("dblclick", () => { cvResetView(); cvDraw(); });
  cv.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") { e.preventDefault(); cvShiftDay(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); cvShiftDay(1); }
    else if (e.key === "0") { cvResetView(); cvDraw(); }
  });
  if (!CV.ro) { CV.ro = new ResizeObserver(() => { if (TAB === "chart" && $("#cvC")) { cvResize(); cvDraw(); } }); }
  CV.ro.disconnect(); CV.ro.observe($("#cvWrap"));
}

function cvShiftDay(dir) {
  if (!CV.data) return;
  const d = new Date(CV.data.day + "T12:00:00Z");
  do { d.setUTCDate(d.getUTCDate() + dir); } while (d.getUTCDay() === 0 || d.getUTCDay() === 6);
  const k = d.toISOString().slice(0, 10);
  if ((CV.data.first && k < CV.data.first) || (CV.data.last && k > CV.data.last)) return toast(dir < 0 ? "Älter sind keine Kerzen gespeichert" : "Das ist der neueste Tag");
  CV.day = k; CV.sel = null; cvLoad(true);
}

function cvClamp() {
  const n = CV.data.candles.length, w = CV.v.i1 - CV.v.i0;
  if (CV.v.i1 < Math.min(n, 8)) { CV.v.i1 = Math.min(n, 8); CV.v.i0 = CV.v.i1 - w; }
  if (CV.v.i0 > n - 8) { CV.v.i0 = n - 8; CV.v.i1 = CV.v.i0 + w; }
}

function cvResize() {
  const cv = $("#cvC"), wrap = $("#cvWrap"); if (!cv || !wrap) return;
  const r = wrap.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  cv.style.width = r.width + "px"; cv.style.height = r.height + "px";
}

/* Zeit (ms) → Kerzen-Index (mit Bruchteil), damit Zonen und Trades genau zwischen Kerzen liegen */
function cvIdx(ms) {
  const c = CV.data.candles, tf = CV.data.tf * 60000;
  if (!c.length) return 0;
  if (ms <= c[0][0]) return (ms - c[0][0]) / tf;
  let lo = 0, hi = c.length - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (c[m][0] <= ms) lo = m; else hi = m - 1; }
  return lo + Math.min(1, (ms - c[lo][0]) / tf);
}

function cvColors() {
  const s = getComputedStyle(document.documentElement), g = k => s.getPropertyValue(k).trim();
  return {bg: g("--bg"), line: g("--line"), fg: g("--fg"), muted: g("--muted"), acc: g("--accent"), pos: g("--pos"), neg: g("--neg"), mono: g("--f-mono")};
}

function cvDraw() {

  const C = cvColors(), d = CV.data, cs = d.candles, L = d.layers, tf = d.tf * 60000;

  ctx.font = `11px ${C.mono}`;

  const tick = d.tick || 0.25, pfmt = p => (Math.round(p / tick) * tick).toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2});

    ctx.fillStyle = {asia: "rgba(99,102,241,.06)", london: "rgba(56,189,248,.05)", ny_am: "rgba(227,179,65,.06)", ny_lunch: "rgba(160,160,160,.035)", ny_pm: "rgba(45,212,191,.05)"}[s.key] || "rgba(255,255,255,.03)";
    ctx.fillRect(a, 0, b - a, ph);
    ctx.strokeStyle = hl(s) ? C.acc : "rgba(160,160,160,.25)"; ctx.setLineDash([2, 4]); ctx.beginPath(); ctx.moveTo(Math.round(a) + .5, 0); ctx.lineTo(Math.round(a) + .5, ph); ctx.stroke(); ctx.setLineDash([]);
    const sn = {asia: "Asien", london: "London", ny_am: "NY AM", ny_lunch: "NY Mittag", ny_pm: "NY PM"}[s.key] || s.name;
    if (b - a > ctx.measureText(sn).width + 10) { ctx.fillStyle = C.muted; ctx.fillText(sn, a + 4, 13); }

    const y1 = Y(z.top), y2 = Y(z.bot), done = ["ungültig", "gefüllt", "abgelaufen", "invertiert"].includes(z.state);
    ctx.fillStyle = col.replace("A", done ? ".06" : ".15"); ctx.fillRect(a, y1, b - a, y2 - y1);
    ctx.strokeStyle = hl(z) ? C.acc : col.replace("A", done ? ".25" : ".55"); ctx.lineWidth = hl(z) ? 2 : 1; ctx.strokeRect(a + .5, y1 + .5, b - a, y2 - y1); ctx.lineWidth = 1;
    if (b - a > 40 && y2 - y1 > 9) { ctx.fillStyle = col.replace("A", ".9"); ctx.fillText(label, a + 4, y1 + 11); }
  };
  if (on("fvg")) for (const z of L.fvg) zone(z, z.dir > 0 ? "rgba(56,189,248,A)" : "rgba(244,114,182,A)", (z.dir > 0 ? "FVG ↑" : "FVG ↓") + (z.state === "invertiert" ? " inv." : ""));
  if (on("ob")) for (const z of L.ob) zone(z, "rgba(167,139,250,A)", (z.dir > 0 ? "OB ↑" : "OB ↓") + (z.state === "ungültig" ? " ✕" : ""));
  // Liquidität

    const a = Math.max(0, XT(p.t0)), b = Math.min(pw, XT(p.t1)); if (b < 0 || a > pw) continue;
    const y = Math.round(Y(p.p)) + .5;
    ctx.strokeStyle = hl(p) ? C.acc : p.side === 0 ? "rgba(217,210,195,.55)" : "rgba(79,140,255,.8)"; ctx.lineWidth = hl(p) ? 2 : 1;
    ctx.setLineDash(p.side === 0 ? [1, 3] : [5, 4]); ctx.beginPath(); ctx.moveTo(a, y); ctx.lineTo(b, y); ctx.stroke(); ctx.setLineDash([]); ctx.lineWidth = 1;
    ctx.fillStyle = p.side === 0 ? C.muted : "#7aa7ff"; const txt = (p.side === 0 ? "Mitternacht" : p.name) + (p.swept ? " ✓" : "");

  }

    if (t.sl0) { const ys = Y(t.sl0); ctx.fillStyle = "rgba(229,83,75,.16)"; ctx.fillRect(a, Math.min(ye, ys), b - a, Math.abs(ys - ye)); }
    ctx.strokeStyle = hl(t) ? C.acc : "rgba(227,179,65,.9)"; ctx.lineWidth = hl(t) ? 2 : 1.2;
    ctx.beginPath(); ctx.moveTo(a, ye); ctx.lineTo(b, ye); ctx.stroke();
    if (t.sl !== t.sl0 && t.sl) { ctx.setLineDash([3, 3]); ctx.strokeStyle = "rgba(229,83,75,.8)"; const y = Y(t.sl); ctx.beginPath(); ctx.moveTo(a, y); ctx.lineTo(b, y); ctx.stroke(); ctx.setLineDash([]); }
    ctx.lineWidth = 1;
    if (t.exit != null && t.status === "geschlossen") { const yx = Y(t.exit); ctx.fillStyle = t.pnl > 0 ? C.pos : C.neg; ctx.beginPath(); ctx.arc(b, yx, 4, 0, 7); ctx.fill(); }
    const up = t.side === "long";
    ctx.fillStyle = C.acc; ctx.beginPath(); ctx.moveTo(a, ye); ctx.lineTo(a - 6, ye + (up ? 9 : -9)); ctx.lineTo(a + 6, ye + (up ? 9 : -9)); ctx.closePath(); ctx.fill();
    const lab = `★ ${up ? "LONG" : "SHORT"} ${t.setup || ""}${t.r != null ? " " + (t.r > 0 ? "+" : "") + num2(t.r) + "R" : t.status === "offen" ? " · läuft" : ""}`;
    ctx.fillStyle = C.acc; ctx.fillText(lab, a + 4, up ? Math.max(12, Y(t.tp || t.entry) - 4) : Math.min(ph - 4, Y(t.tp || t.entry) + 13));
  }
  // Kerzen
  const cw = Math.max(1, Math.min(14, bw * 0.68));
  for (let i = Math.max(0, Math.floor(i0) - 1); i < Math.min(cs.length, Math.ceil(i1) + 1); i++) {
    const [, o, h, l, c] = cs[i], x = X(i) + bw / 2, up = c >= o;
    ctx.strokeStyle = ctx.fillStyle = up ? C.pos : C.neg;
    ctx.beginPath(); ctx.moveTo(Math.round(x) + .5, Y(h)); ctx.lineTo(Math.round(x) + .5, Y(l)); ctx.stroke();

  }
