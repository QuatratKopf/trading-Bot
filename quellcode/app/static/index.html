<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FVG Trader</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#070b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FVG Trader">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f5bd3'/%3E%3Crect x='7' y='6' width='5' height='12' fill='white'/%3E%3Crect x='14' y='11' width='5' height='14' fill='white' opacity='.55'/%3E%3Crect x='21' y='15' width='5' height='11' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: feste Kopfzeile mit Modus-Schalter & Notaus → Reiter → Cockpit (Vorschläge zuerst, dann Positionen, dann Verlauf) */
:root{
  --bg:#070b14; --surface:#0d1424; --raise:#111a2e; --sunk:#0a101d; --line:#1a2540; --line2:#24314f; --fg:#e4e9f2; --muted:#7d8aa5;
  --accent:#4c8dff; --accent-fg:#fff; --pos:#2fd39a; --neg:#ff5d6c; --warn:#f2b441; --fill:rgba(76,141,255,.13);
  --pos-bg:rgba(47,211,154,.09); --neg-bg:rgba(255,93,108,.09); --warn-bg:rgba(242,180,65,.12);
  --f-display:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
body{background:radial-gradient(1200px 500px at 50% -200px,rgba(76,141,255,.08),transparent 70%) var(--bg) fixed}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{color:var(--fg);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 60px max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}

/* Kopfzeile mit Auswahlleiste oben */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;flex:none}
.brand i{display:inline-block;width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--pos)))}
.nav{display:flex;gap:2px;margin:0 auto;padding:3px;background:var(--sunk);border-radius:12px}
.nav button{display:flex;align-items:center;gap:8px;padding:8px 14px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:500 14px var(--f-body);white-space:nowrap;transition:background .12s,color .12s}
.nav button:hover{color:var(--fg)}
.nav svg{width:18px;height:18px;flex:none;display:block}
.nav button[aria-current=true]{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar-r{display:flex;align-items:center;gap:10px;flex:none}
.status{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:14px}
.status .hint{font-size:11.5px;margin-left:auto}
.content{min-width:0}
@media (max-width:1060px){ .nav button span{display:none} .nav button{padding:8px 12px} .nav button[aria-current=true] span{display:inline} }
@media (max-width:820px){
  .bar{flex-wrap:wrap;gap:10px 12px}
  .brand{font-size:16px;margin-right:auto}
  .nav{order:3;width:100%;display:grid;grid-template-columns:repeat(5,1fr);margin:0}
  .nav button{flex-direction:column;gap:3px;padding:6px 0;font-size:10.5px}
  .nav button span,.nav button[aria-current=true] span{display:inline}
  .status .hint{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi .v{font-size:18px}
  .switch b{display:none}
}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--pos)} .dot.bad{background:var(--neg)} .dot.warn{background:var(--warn)}
.switch{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.switch b{font-weight:600;font-size:13px}
.tgl{position:relative;width:46px;height:26px;border-radius:999px;border:0;background:var(--line);transition:background .15s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tgl[aria-checked=true]{background:var(--pos)} .tgl[aria-checked=true]::after{transform:translateX(20px)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:7px 12px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.good{background:var(--pos);border-color:var(--pos);color:#fff;font-weight:600}
.btn.danger{background:var(--neg);border-color:var(--neg);color:#fff;font-weight:600}
.btn.ghost-danger{color:var(--neg);border-color:var(--neg)}
.btn:disabled{opacity:.5;cursor:default}
.banner{margin:12px 0 0;padding:10px 14px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-weight:500}

main{display:flex;flex-direction:column;gap:22px;padding-top:22px;padding-bottom:40px}
h2{font-family:var(--f-display);font-weight:600;font-size:16px;margin:0}
.section{display:flex;flex-direction:column;gap:10px;min-width:0}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.empty{color:var(--muted);font-size:13px;padding:18px;border:1px dashed var(--line);border-radius:8px;text-align:center}

/* Kennzahlen */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:500 13px var(--f-body);background:transparent;color:var(--muted);border:0;border-right:1px solid var(--line);padding:7px 12px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fill);color:var(--accent);font-weight:600}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--neg)}

/* Vorschläge */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.sug{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.sug.long{border-left-color:var(--pos)} .sug.short{border-left-color:var(--neg)}
.sug-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.side{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.02em}
.side.long{color:var(--pos)} .side.short{color:var(--neg)}
.chip{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:4px;background:var(--fill);color:var(--accent);font-weight:500;white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.good{background:var(--pos-bg);color:var(--pos)}
.chip.bad{background:var(--neg-bg);color:var(--neg)}
.chip.mute{background:var(--sunk);color:var(--muted)}
.timer{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px}
.lv div{display:flex;flex-direction:column;min-width:0}
.lv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lv b{font-family:var(--f-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.edit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.edit label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.edit input{width:100%}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.actions{display:flex;gap:8px}
.actions .btn{flex:1;padding:9px 12px}

/* Tabellen */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{font-family:var(--f-mono);font-size:12.5px;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.t,th.t{text-align:left;font-family:var(--f-body)}
td.wrap{white-space:normal;min-width:260px;font-family:var(--f-body);font-size:12.5px;text-align:left;color:var(--muted)}
tr:last-child td{border-bottom:0}
.rowbtns{display:flex;gap:6px;justify-content:flex-end}
.rowbtns .btn{padding:4px 9px;font-size:12px}

.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.wizard{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:14px}
.wizard li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start}
.wizard .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--sunk);color:var(--muted)}
.wizard li.done .num{background:var(--pos-bg);color:var(--pos)}
.wizard li.now .num{background:var(--accent);color:var(--accent-fg)}
.wizard li.done .hint{display:none}
.feed{display:flex;flex-direction:column;gap:0;max-height:360px;overflow:auto}
.feed div{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.feed time{font-family:var(--f-mono);color:var(--muted);font-size:11.5px}
.feed .warn{color:var(--warn)} .feed .error{color:var(--neg)}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.gl{stroke:var(--line)}

/* Performance & Grafiken */
.perf{display:flex;flex-direction:column;gap:14px}
.perf-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.perf-ctl{display:flex;gap:8px;flex-wrap:wrap}
.perf-b{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.ring{position:relative;width:170px;height:170px;flex:none}
.ring svg{display:block}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-v{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.ring-l{font-size:12px;color:var(--muted)}
.perf-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.perf-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.perf-stats div{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:8px;background:var(--sunk);min-width:0}
.perf-stats span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.perf-stats b{font-family:var(--f-mono);font-size:17px;font-weight:500;white-space:nowrap}
.spark{border-radius:8px;background:var(--sunk);padding:6px}
.spark svg{width:100%;display:block}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:12px;align-items:center}
.hbar-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.hbar-l .hint{font-size:11.5px}
.hbar-t{position:relative;height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.hbar-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.hbar-t i{position:absolute;top:0;bottom:0;border-radius:5px}
.hbar-t i.p{left:50%;background:var(--pos)} .hbar-t i.n{right:50%;background:var(--neg)}
.hbar b{font-size:13px;text-align:right;min-width:70px}
.panel{box-shadow:0 1px 2px rgba(10,15,30,.04)}
@media (max-width:720px){ .perf-b{grid-template-columns:1fr;justify-items:center} .perf-side{width:100%} .perf-stats{grid-template-columns:repeat(2,minmax(0,1fr))} }

.sess-list{display:flex;flex-direction:column;gap:6px}
.sess{display:grid;grid-template-columns:20px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.sess.on,.sess:has(input:checked){border-color:var(--accent);background:var(--fill)}
.sess-n{font-size:13.5px;font-weight:500}
.sess-t{font-size:12px}
@media (max-width:560px){ .sess{grid-template-columns:20px minmax(0,1fr)} .sess-t{grid-column:2} }

/* Kalender */
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cal-mon{display:flex;align-items:center;gap:6px}
.cal-mon h2{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 8px 0 2px;min-width:0;text-transform:none;color:var(--fg)}
.cal-mon h2 small{font-weight:400;color:var(--muted);margin-left:6px}
.ibtn{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);padding:0}
.ibtn:hover{color:var(--fg);border-color:var(--line2)}
.ibtn svg{width:16px;height:16px}
.cal-act{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.strip{display:grid;grid-template-columns:1.4fr repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px}
.strip > div{padding:14px 18px;display:flex;flex-direction:column;gap:4px;min-width:0;border-left:1px solid var(--line)}
.strip > div:first-child{border-left:0}
.strip .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.strip .v{font-family:var(--f-mono);font-size:19px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .big{font-size:28px;font-weight:600;letter-spacing:-.02em}
.strip .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--sunk);margin-top:3px}
.wl i{display:block;height:100%}
@media (max-width:820px){ .strip{grid-template-columns:repeat(2,minmax(0,1fr))} .strip > div{border-left:0;border-top:1px solid var(--line)} .strip > div:first-child{grid-column:1/-1;border-top:0} .strip > div:nth-child(odd):not(:first-child){border-left:1px solid var(--line)} }
.calbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;overflow:hidden}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.05fr);gap:6px}
.cal .dow{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;padding:8px 10px 2px}
.day{position:relative;min-height:96px;border:1px solid var(--line);border-radius:9px;background:var(--raise);padding:9px 11px;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;min-width:0;cursor:pointer;transition:border-color .12s,background .12s,transform .12s}
.day:hover{border-color:var(--line2);background:color-mix(in srgb,var(--raise) 80%,var(--accent) 6%)}
.day.win{background:linear-gradient(180deg,rgba(47,211,154,.13),rgba(47,211,154,.04));border-color:rgba(47,211,154,.28)}
.day.loss{background:linear-gradient(180deg,rgba(255,93,108,.13),rgba(255,93,108,.04));border-color:rgba(255,93,108,.28)}
.day.win:hover{border-color:rgba(47,211,154,.6)} .day.loss:hover{border-color:rgba(255,93,108,.6)}
.day.empty{background:transparent}
.day.out{background:transparent;border-color:transparent;opacity:.35;cursor:default}
.day.sel{border-color:var(--accent)!important;box-shadow:0 0 0 1px var(--accent),0 6px 20px rgba(76,141,255,.18)}
.day .dn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500;display:flex;align-items:center;gap:6px}
.day.today .dn b{background:var(--accent);color:#fff;border-radius:6px;padding:0 6px;font-weight:600}
.day .dn b{font-weight:500}
.day .pl{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto}
.day .pl .s{display:none}
.day .meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center}
.dots{display:flex;gap:3px;flex-wrap:wrap;max-width:100%}
.dots i{width:6px;height:6px;border-radius:2px;background:var(--line2)}
.dots i.w{background:var(--pos)} .dots i.l{background:var(--neg)}
.wk{border-radius:9px;border:1px dashed var(--line2);background:transparent;padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-height:96px;min-width:0}
.wk .dn{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.wk .pl{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:auto}
.wk .meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .pl .s,.wk .dn .s,.day .meta .s,.wk .meta .s{display:none}
.daybox{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.daybox-h{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.daybox-h h2{font-size:15px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--fg)}
.daybox-h .v{font-family:var(--f-mono);font-size:18px;font-weight:600}
.daybox-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.daybox table{margin:0}
.daybox .empty{margin:16px;border-color:var(--line2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
@media (max-width:640px){
  .calbox{padding:4px}
  .cal{gap:3px}
  .day,.wk{min-height:60px;padding:5px 6px;border-radius:7px}
  .day .pl,.wk .pl{font-size:10.5px;letter-spacing:-.03em;text-overflow:clip}
  .day,.wk{padding:5px 4px}
  .day .pl .f,.wk .pl .f,.wk .dn .f{display:none} .day .pl .s,.wk .pl .s,.wk .dn .s{display:inline}
  .day .meta,.wk .meta,.dots{display:none}
  .cal .dow{font-size:9.5px;padding:4px 4px 0}
  .cal-mon h2{font-size:18px}
}

<body>
<div id="app"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = v => v == null || !isFinite(v) ? "–" : (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("de-DE", {maximumFractionDigits: 0});
const usd2 = v => v == null || !isFinite(v) ? "–" : (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const px = v => v == null ? "–" : Number(v).toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = v => v == null || !isFinite(v) ? "–" : v.toFixed(1).replace(".", ",") + " %";
const num2 = v => v == null || !isFinite(v) ? "–" : v.toFixed(2).replace(".", ",");
const cls = v => v > 0 ? "pos" : v < 0 ? "neg" : "";
const tm = ts => new Date(ts * 1000).toLocaleTimeString("de-DE", {hour: "2-digit", minute: "2-digit"});
const dtm = ts => new Date(ts * 1000).toLocaleString("de-DE", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});

// Reiter in der Adresse merken, ohne neue Verlaufseinträge (sonst darf sich das App-Fenster nicht schließen)
const setHash = t => { try { history.replaceState(null, "", "#" + t); } catch (e) { location.hash = t; } };
let S = null, TAB = "cockpit", pendingKey = "", seenPending = new Set(), firstLoad = true, settingsDirty = false;

async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json", "X-Requested-With": "fvg"}, body: JSON.stringify(body)};
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !path.startsWith("/api/login")) { showLogin(); throw new Error("Bitte anmelden"); }
  if (!r.ok) throw new Error(j.error || "Fehler " + r.status);
  return j;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200);
}
async function act(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg); await refresh(); return r; }
  catch (e) { toast(e.message); }
}

function copyText(txt, label) {
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast((label || "Text") + " kopiert"); } catch (e) { toast("Bitte manuell kopieren"); } ta.remove(); };
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast((label || "Text") + " kopiert"), fallback); else fallback();
}

async function runUpdate(doIt) {
  const before = S && S.version;
  document.body.insertAdjacentHTML("beforeend", `<div id="updOv" style="position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px">
    <div style="text-align:center;max-width:380px;display:flex;flex-direction:column;gap:10px;align-items:center">
      <h2 style="font-size:20px" id="updT">Update wird geladen …</h2>
      <p class="hint" id="updMsg" style="margin:0">Die neue Version wird heruntergeladen und geprüft.</p>
      <div id="updAct"></div></div></div>`);
  const msg = (t, m, act) => { $("#updT").textContent = t; $("#updMsg").innerHTML = m; $("#updAct").innerHTML = act || ""; };
  let res;
  try { res = await doIt(); } catch (e) {
    msg("Update fehlgeschlagen", esc(e.message), '<button class="btn" id="updClose">Schließen</button>');
    $("#updClose").onclick = () => $("#updOv").remove(); return;
  }
  const target = res && res.version;
  msg("Neustart …", `Version <b>${esc(target || "neu")}</b> ist installiert. FVG Trader startet neu, das dauert ein paar Sekunden.`);
  const t0 = Date.now();
  let kills = 0;
  const poll = async () => {
    const secs = (Date.now() - t0) / 1000;
    try {
      const r = await fetch("/api/state", {cache: "no-store"});
      if (r.status === 401) { location.reload(); return; }
      if (r.ok) {
        const j = await r.json();
        if (j.version !== before) { location.reload(); return; }
        if (secs > 12 && kills < 5) {   // eine alte Instanz antwortet noch: beenden, die neue übernimmt
          kills++;
          msg("Räume auf …", "Eine ältere FVG-Trader-Instanz läuft noch im Hintergrund und wird beendet.");
          try { await fetch("/api/shutdown", {method: "POST", headers: {"X-Requested-With": "fvg", "Content-Type": "application/json"}, body: "{}"}); } catch (e) {}
        }
      }
    } catch (e) {}
    if (secs > 30) {
      msg("Update installiert ✓", `Version <b>${esc(target || "neu")}</b> ist installiert.<br>Schließ dieses Fenster und starte FVG Trader über das <b>Desktop-Symbol</b>.`,
        '<button class="btn" id="updRetry">Erneut verbinden</button>');
      $("#updRetry").onclick = () => location.reload(); return;
    }
    setTimeout(poll, 1000);
  };
  setTimeout(poll, 2000);
}
async function startupUpdatePrompt() {
  if (!S.config.update_url) return;
  let u;
  try { u = await api("/api/update/check", {}); } catch (e) { return; }
  if (!u.available) return;
  try { if (sessionStorage.getItem("fvg-upd-asked") === u.version) return; sessionStorage.setItem("fvg-upd-asked", u.version); } catch (e) {}
  document.body.insertAdjacentHTML("beforeend", `<div id="updAsk" role="dialog" aria-modal="true" aria-labelledby="updAskT"
    style="position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.55);display:grid;place-items:center;padding:16px">
    <div class="panel" style="max-width:400px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)">
      <h2 id="updAskT" style="font-size:19px">Update verfügbar</h2>
      <p style="margin:0">Version <b>${esc(u.version)}</b> ist da (installiert: ${esc(S.version)}).${u.notes ? `<br><span class="hint">${esc(u.notes)}</span>` : ""}</p>
      <p class="hint" style="margin:0">Jetzt aktualisieren? Deine Einstellungen und Trades bleiben erhalten.</p>
      <div class="actions"><button class="btn primary" id="updYes">Ja, jetzt aktualisieren</button><button class="btn" id="updNo">Nein</button></div>
    </div></div>`);
  $("#updYes").focus();
  $("#updNo").onclick = () => $("#updAsk").remove();
  $("#updYes").onclick = () => { $("#updAsk").remove(); runUpdate(() => api("/api/update/apply", {})); };
}

/* ───────── Login ───────── */
async function showLogin() {
  const a = await fetch("/api/auth").then(r => r.json());
  const setup = !a.has_password;
  $("#app").innerHTML = `<div class="login"><form id="lf">
    <h1>FVG Trader</h1>
    <p class="hint">${setup ? "Lege ein Passwort fest. Es schützt die App, sobald sie über das Internet erreichbar ist." : "Melde dich an, um deinen Bot zu steuern."}</p>
    <input id="pw" type="password" autocomplete="${setup ? "new-password" : "current-password"}" placeholder="Passwort${setup ? " (mind. 8 Zeichen)" : ""}" required>
    <button class="btn primary" type="submit">${setup ? "Passwort festlegen" : "Anmelden"}</button>
    <p id="lerr" class="err-msg" hidden></p></form></div>`;
  $("#pw").focus();
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    try { await api(setup ? "/api/setup" : "/api/login", {password: $("#pw").value}); start(); }
    catch (err) { $("#lerr").textContent = err.message; $("#lerr").hidden = false; }
  };
}

/* ───────── Gerüst ───────── */
const NAV = [
  ["cockpit", "Cockpit", '<path d="M4 15a8 8 0 1 1 16 0"/><path d="M12 15l4.5-4.5"/><circle cx="12" cy="15" r="1.2"/>'],
  ["calendar", "Kalender", '<rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3v4M15 3v4"/>'],
  ["stats", "Statistik", '<path d="M5 19v-7M12 19V5M19 19v-10"/>'],
  ["learn", "Lernmodul", '<path d="M12 3.5l2.3 4.8 5.2.7-3.8 3.7.9 5.2L12 15.4 7.4 17.9l.9-5.2-3.8-3.7 5.2-.7z"/>'],
  ["settings", "Einstellungen", '<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>'],
];
const icon = d => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
function shell() {
  $("#app").innerHTML = `
  <header class="top"><div class="wrap bar">
    <div class="brand"><i aria-hidden="true"></i>FVG Trader</div>
    <nav class="nav" aria-label="Bereiche">${NAV.map(([k, l, d]) => `<button type="button" data-tab="${k}" aria-current="${k === TAB}" title="${l}">${icon(d)}<span>${l}</span></button>`).join("")}</nav>
    <div class="bar-r">
      <span class="dot" id="pDot" title="TradingView-Verbindung" hidden></span>
      <div class="switch"><b id="autoLbl">Auto</b><button class="tgl" id="autoT" role="switch" aria-checked="false" aria-labelledby="autoLbl"></button></div>
      <button class="btn danger" id="kill">Notaus</button>
    </div>
  </div></header>

async function showLog() {
  let r;
  try { r = await api("/api/log"); } catch (e) { toast(e.message); return; }
  let view = "log";
  const text = () => view === "log" ? (r.log.length ? r.log.join("\n") : "(noch keine Einträge)") : (r.events.join("\n") || "(keine Aktivität)");
  const close = modal(`<div class="section-h"><h2 style="font-size:18px">Protokoll · Version ${esc(r.version)}</h2>
      <div class="seg" role="group" aria-label="Ansicht"><button type="button" data-v="log" aria-pressed="true">App-Log</button><button type="button" data-v="ev" aria-pressed="false">Aktivität</button></div></div>

    <p class="hint" style="margin:0;word-break:break-all">Datei: ${esc(r.path)}</p>
    <div class="actions"><button class="btn primary" id="logCopy">Alles kopieren</button><button class="btn" id="logClose">Schließen</button></div>`);
  const fill = () => { $("#logTxt").textContent = text(); $("#logTxt").scrollTop = $("#logTxt").scrollHeight; };
  document.querySelectorAll("#mdl [data-v]").forEach(b => b.onclick = () => { view = b.dataset.v === "log" ? "log" : "ev";
    document.querySelectorAll("#mdl [data-v]").forEach(x => x.setAttribute("aria-pressed", x === b)); fill(); });
  fill();
  $("#logCopy").onclick = () => copyText(`FVG Trader ${r.version}\n--- App-Log ---\n${r.log.slice(-120).join("\n")}\n--- Aktivität ---\n${r.events.slice(-60).join("\n")}`, "Protokoll");
  $("#logClose").onclick = close;
}

/* ───────── Nur ein Fenster ───────── */
// Wird FVG Trader ein zweites Mal geöffnet, übernimmt das neue Fenster; das alte schließt sich oder wird gesperrt.
const WIN_ID = Math.random().toString(36).slice(2);
let BLOCKED = false;
const BC = "BroadcastChannel" in window ? new BroadcastChannel("fvg-trader-fenster") : null;
function claimWindow() { BLOCKED = false; const o = $("#winBlock"); if (o) o.remove(); if (BC) BC.postMessage({t: "claim", id: WIN_ID}); }
function blockWindow() {
  if (BLOCKED) return;
  BLOCKED = true;
  try { window.close(); } catch (e) {}
  document.body.insertAdjacentHTML("beforeend", `<div id="winBlock" style="position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:16px">
    <div class="panel" style="max-width:380px;display:flex;flex-direction:column;gap:12px;text-align:center">
      <h2 style="font-size:19px">In einem anderen Fenster geöffnet</h2>
      <p class="hint" style="margin:0">FVG Trader läuft schon in einem anderen Fenster. Du kannst dieses hier schließen.</p>
      <button class="btn primary" id="winHere">Hier weiterverwenden</button></div></div>`);
  $("#winHere").onclick = () => { claimWindow(); refresh(true); };
}
if (BC) BC.onmessage = e => { if (e.data && e.data.t === "claim" && e.data.id !== WIN_ID) blockWindow(); };

/* ───────── Laufzeit ───────── */
function render(full) {
  if (!S) return;
  if (full && TAB !== "settings" && $("#main")) { $("#main").oninput = null; $("#main").onchange = null; }
  header();
  document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-current", x.dataset.tab === TAB));
  document.title = "FVG Trader · " + (NAV.find(n => n[0] === TAB) || NAV[0])[1];
  if (TAB === "cockpit") cockpit(full);
  else if (full) ({calendar, stats, learn, settings}[TAB])();
  else if (TAB === "settings" && !settingsDirty && !document.activeElement.matches("input,select")) {
    // Status-Anzeigen live nachziehen (Verbindung, Broker, Updates, Abruf), ohne Eingaben zu stören
    const key = JSON.stringify([S.tunnel, S.hook_url, S.broker, S.update, S.own_sync && S.own_sync.last, S.own_sync && S.own_sync.error, S.autostart]);
    if (key !== settingsKey) { const y = scrollY; settings(); scrollTo(0, y); }
  }
  else if (TAB === "stats" || TAB === "learn" || TAB === "calendar") ({calendar, stats, learn}[TAB])();
}
async function refresh(full) {
  S = await api("/api/state");
  notifyNew();
  render(full);
}
function notifyNew() {
  const ids = S.pending.map(p => p.id), fresh = ids.filter(id => !seenPending.has(id));
  ids.forEach(id => seenPending.add(id));
  if (firstLoad) { firstLoad = false; return; }
  if (!fresh.length) return;

  if ("Notification" in window && Notification.permission === "granted")
    new Notification("Neuer Trade-Vorschlag", {body: `${p.side === "long" ? "LONG" : "SHORT"} ${p.qty}× ${p.root} · ${p.setup} · Stop ${px(p.sl)}`});
}
async function start() {
  TAB = ["cockpit", "calendar", "stats", "learn", "settings"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "cockpit";

  }, 2000);
  setInterval(() => !BLOCKED && S && TAB === "cockpit" && timers(), 1000);
}
