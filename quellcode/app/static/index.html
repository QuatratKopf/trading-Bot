<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FVG Trader</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2f5bd3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FVG Trader">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232f5bd3'/%3E%3Crect x='7' y='6' width='5' height='12' fill='white'/%3E%3Crect x='14' y='11' width='5' height='14' fill='white' opacity='.55'/%3E%3Crect x='21' y='15' width='5' height='11' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: feste Kopfzeile mit Modus-Schalter & Notaus → Reiter → Cockpit (Vorschläge zuerst, dann Positionen, dann Verlauf) */
:root{
  --bg:#f3f4f7; --surface:#fff; --sunk:#eceef3; --line:#d9dce5; --fg:#161a24; --muted:#5d6475;
  --accent:#2f5bd3; --accent-fg:#fff; --pos:#0f8a72; --neg:#d2493f; --warn:#b86e00; --fill:rgba(47,91,211,.10);
  --pos-bg:rgba(15,138,114,.10); --neg-bg:rgba(210,73,63,.10); --warn-bg:rgba(184,110,0,.12);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10131b; --surface:#171b26; --sunk:#12151e; --line:#2a3040; --fg:#e7e9ef; --muted:#9097a8;
  --accent:#7b9cff; --accent-fg:#0d1020; --pos:#3cc4a4; --neg:#f2766b; --warn:#f0a43a; --fill:rgba(123,156,255,.14);
  --pos-bg:rgba(60,196,164,.12); --neg-bg:rgba(242,118,107,.12); --warn-bg:rgba(240,164,58,.14); color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 60px max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}

/* Kopfzeile */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-bottom:0}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 0}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:22px;height:22px;border-radius:5px;background:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--pos)} .dot.bad{background:var(--neg)} .dot.warn{background:var(--warn)}
.switch{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.switch b{font-weight:600;font-size:13px}
.tgl{position:relative;width:46px;height:26px;border-radius:999px;border:0;background:var(--line);transition:background .15s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tgl[aria-checked=true]{background:var(--pos)} .tgl[aria-checked=true]::after{transform:translateX(20px)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:7px 12px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.good{background:var(--pos);border-color:var(--pos);color:#fff;font-weight:600}
.btn.danger{background:var(--neg);border-color:var(--neg);color:#fff;font-weight:600}
.btn.ghost-danger{color:var(--neg);border-color:var(--neg)}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:4px;overflow-x:auto}
@media (max-width:600px){
  .top{position:static}
  .bar{gap:8px;padding:10px 0}
  .brand{font-size:18px;width:100%}
  #pSess,#pBroker{display:none}
  .switch{padding:3px 4px 3px 10px}
  #kill{padding:6px 10px}
  .tabs button{padding:9px 9px}
}
.tabs button{border:0;background:none;color:var(--muted);padding:10px 12px;border-bottom:2px solid transparent;font-weight:500;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--accent)}
.banner{margin:12px 0 0;padding:10px 14px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-weight:500}

main{display:flex;flex-direction:column;gap:20px;padding-top:20px}
h2{font-family:var(--f-display);font-weight:600;font-size:16px;margin:0}
.section{display:flex;flex-direction:column;gap:10px;min-width:0}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.empty{color:var(--muted);font-size:13px;padding:18px;border:1px dashed var(--line);border-radius:8px;text-align:center}

/* Kennzahlen */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0;box-shadow:1px 0 0 var(--line),0 1px 0 var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:500 13px var(--f-body);background:transparent;color:var(--muted);border:0;border-right:1px solid var(--line);padding:7px 12px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fill);color:var(--accent);font-weight:600}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--neg)}

/* Vorschläge */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.sug{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.sug.long{border-left-color:var(--pos)} .sug.short{border-left-color:var(--neg)}
.sug-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.side{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.02em}
.side.long{color:var(--pos)} .side.short{color:var(--neg)}
.chip{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:4px;background:var(--fill);color:var(--accent);font-weight:500;white-space:nowrap}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.good{background:var(--pos-bg);color:var(--pos)}
.chip.bad{background:var(--neg-bg);color:var(--neg)}
.chip.mute{background:var(--sunk);color:var(--muted)}
.timer{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px}
.lv div{display:flex;flex-direction:column;min-width:0}
.lv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lv b{font-family:var(--f-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.edit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.edit label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.edit input{width:100%}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.actions{display:flex;gap:8px}
.actions .btn{flex:1;padding:9px 12px}

/* Tabellen */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{font-family:var(--f-mono);font-size:12.5px;text-align:right;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.t,th.t{text-align:left;font-family:var(--f-body)}
td.wrap{white-space:normal;min-width:260px;font-family:var(--f-body);font-size:12.5px;text-align:left;color:var(--muted)}
tr:last-child td{border-bottom:0}
.rowbtns{display:flex;gap:6px;justify-content:flex-end}
.rowbtns .btn{padding:4px 9px;font-size:12px}

.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.wizard{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:14px}
.wizard li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start}
.wizard .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--sunk);color:var(--muted)}
.wizard li.done .num{background:var(--pos-bg);color:var(--pos)}
.wizard li.now .num{background:var(--accent);color:var(--accent-fg)}
.wizard li.done .hint{display:none}
.feed{display:flex;flex-direction:column;gap:0;max-height:360px;overflow:auto}
.feed div{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.feed time{font-family:var(--f-mono);color:var(--muted);font-size:11.5px}
.feed .warn{color:var(--warn)} .feed .error{color:var(--neg)}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.gl{stroke:var(--line)}

/* Kalender */
.cal-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cal-h h2{font-size:20px;min-width:170px;text-align:center}
.cal-nav{width:34px;height:34px;padding:0;font-size:18px;line-height:1}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.1fr);gap:6px}
.cal .dow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:0 4px 2px}
.day{position:relative;min-height:92px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;font:inherit;color:inherit;min-width:0}
.day.win{background:var(--pos-bg);border-color:color-mix(in srgb,var(--pos) 35%,var(--line))}
.day.loss{background:var(--neg-bg);border-color:color-mix(in srgb,var(--neg) 35%,var(--line))}
.day.out{background:transparent;border-style:dashed;opacity:.45}
.day.today{outline:2px solid var(--accent);outline-offset:-1px}
.day.sel{box-shadow:0 0 0 2px var(--fg) inset}
button.day{cursor:pointer}
.day .dn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.day .pl{font-family:var(--f-mono);font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .pl .s{display:none}
.day .meta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk{border-radius:8px;border:1px solid var(--line);background:var(--sunk);padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between;min-height:92px;min-width:0}
.wk .dn{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.wk .pl{font-family:var(--f-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk .pl .s,.wk .dn .s{display:none}
@media (max-width:640px){
  .cal{gap:3px}
  .day,.wk{min-height:58px;padding:5px 5px;border-radius:6px}
  .day .pl,.wk .pl{font-size:12px}
  .day .pl .f,.wk .pl .f,.wk .dn .f{display:none} .day .pl .s,.wk .pl .s,.wk .dn .s{display:inline}
  .day .meta,.wk .meta{display:none}
  .cal .dow{font-size:10px;padding:0 2px}
}

.day .meta .s,.wk .meta .s{display:none}
.modal-bg{position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal select{width:100%}
.modal:has(.logbox){max-width:820px}
.logbox{max-height:min(60vh,520px);overflow:auto;white-space:pre;word-break:normal;margin:0;font-size:11.5px;line-height:1.45}
@media (max-width:640px){ .day .meta,.wk .meta{display:block;font-size:10px} .day .meta .f,.wk .meta .f{display:none} .day .meta .s,.wk .meta .s{display:inline} }

/* Einstellungen */
.settings-wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px;width:100%}
.set-sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.set-h{display:flex;flex-direction:column;gap:2px}
.set-h h2{font-size:16px}
.set-b{display:flex;flex-direction:column;gap:10px;min-width:0}
.sub{display:flex;flex-direction:column;gap:10px;padding-left:12px;border-left:2px solid var(--line)}
.form{display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,42%);gap:12px;align-items:center}
.row[hidden]{display:none}
.row label{font-size:13.5px}
.row small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
.row input,.row select{width:100%}
.row .tgl,.row > .btn,.row .chk{justify-self:end}
.row input.chk,.chk{width:18px;height:18px;accent-color:var(--accent)}
.inline{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.inline input[type=time]{width:auto}
.wrap-gap{justify-content:flex-start}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:4px 0 4px}
.preview{display:flex;flex-direction:column;gap:4px;background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:12.5px}
.preview div{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline}
.pv{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pv b{color:var(--fg);font-weight:500}
details.adv summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::after{content:"▾";color:var(--muted);transition:transform .15s}
details.adv[open] summary::after{transform:rotate(180deg)}
.savebar{position:sticky;bottom:max(12px,env(safe-area-inset-bottom,0px));margin:14px auto 0;max-width:820px;width:100%;display:flex;gap:10px;align-items:center;justify-content:flex-end;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:6}
.savebar .hint{margin-right:auto}
@media (max-width:560px){ .row{grid-template-columns:1fr} .row .tgl,.row > .btn,.row .chk{justify-self:start} .inline{justify-content:flex-start} }
.save{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.ok-msg{font-size:12.5px;color:var(--pos)} .err-msg{font-size:12.5px;color:var(--neg)}
.code{font-family:var(--f-mono);font-size:12px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:10px;word-break:break-all;white-space:pre-wrap}
.copyrow{display:flex;gap:8px;align-items:stretch}
.copyrow .code{flex:1;min-width:0}
ol.steps{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13px}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{width:min(360px,100%);display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
.login h1{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0}

.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = v => v == null || !isFinite(v) ? "–" : (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("de-DE", {maximumFractionDigits: 0});
const usd2 = v => v == null || !isFinite(v) ? "–" : (v < 0 ? "−$" : "$") + Math.abs(v).toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const px = v => v == null ? "–" : Number(v).toLocaleString("de-DE", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = v => v == null || !isFinite(v) ? "–" : v.toFixed(1).replace(".", ",") + " %";
const num2 = v => v == null || !isFinite(v) ? "–" : v.toFixed(2).replace(".", ",");
const cls = v => v > 0 ? "pos" : v < 0 ? "neg" : "";
const tm = ts => new Date(ts * 1000).toLocaleTimeString("de-DE", {hour: "2-digit", minute: "2-digit"});
const dtm = ts => new Date(ts * 1000).toLocaleString("de-DE", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"});

let S = null, TAB = "cockpit", pendingKey = "", seenPending = new Set(), firstLoad = true, settingsDirty = false;

async function api(path, body) {
  const opt = body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json", "X-Requested-With": "fvg"}, body: JSON.stringify(body)};
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !path.startsWith("/api/login")) { showLogin(); throw new Error("Bitte anmelden"); }
  if (!r.ok) throw new Error(j.error || "Fehler " + r.status);
  return j;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200);
}
async function act(fn, okMsg) {
  try { const r = await fn(); if (okMsg) toast(okMsg); await refresh(); return r; }
  catch (e) { toast(e.message); }
}

function copyText(txt, label) {
  const fallback = () => { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast((label || "Text") + " kopiert"); } catch (e) { toast("Bitte manuell kopieren"); } ta.remove(); };
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast((label || "Text") + " kopiert"), fallback); else fallback();
}

async function runUpdate(doIt) {
  const before = S && S.version;
  document.body.insertAdjacentHTML("beforeend", `<div id="updOv" style="position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px">
    <div style="text-align:center;max-width:380px;display:flex;flex-direction:column;gap:10px;align-items:center">
      <h2 style="font-size:20px" id="updT">Update wird geladen …</h2>
      <p class="hint" id="updMsg" style="margin:0">Die neue Version wird heruntergeladen und geprüft.</p>
      <div id="updAct"></div></div></div>`);
  const msg = (t, m, act) => { $("#updT").textContent = t; $("#updMsg").innerHTML = m; $("#updAct").innerHTML = act || ""; };
  let res;
  try { res = await doIt(); } catch (e) {
    msg("Update fehlgeschlagen", esc(e.message), '<button class="btn" id="updClose">Schließen</button>');
    $("#updClose").onclick = () => $("#updOv").remove(); return;
  }
  const target = res && res.version;
  msg("Neustart …", `Version <b>${esc(target || "neu")}</b> ist installiert. FVG Trader startet neu, das dauert ein paar Sekunden.`);
  const t0 = Date.now();
  let kills = 0;
  const poll = async () => {
    const secs = (Date.now() - t0) / 1000;
    try {
      const r = await fetch("/api/state", {cache: "no-store"});
      if (r.status === 401) { location.reload(); return; }
      if (r.ok) {
        const j = await r.json();
        if (j.version !== before) { location.reload(); return; }
        if (secs > 12 && kills < 5) {   // eine alte Instanz antwortet noch: beenden, die neue übernimmt
          kills++;
          msg("Räume auf …", "Eine ältere FVG-Trader-Instanz läuft noch im Hintergrund und wird beendet.");
          try { await fetch("/api/shutdown", {method: "POST", headers: {"X-Requested-With": "fvg", "Content-Type": "application/json"}, body: "{}"}); } catch (e) {}
        }
      }
    } catch (e) {}
    if (secs > 45) {
      msg("Fast geschafft", `Version <b>${esc(target || "neu")}</b> ist installiert, nur der automatische Neustart hat nicht geklappt.<br>Starte FVG Trader einfach über das <b>Desktop-Symbol</b>.`,
        '<button class="btn" id="updRetry">Erneut verbinden</button>');
      $("#updRetry").onclick = () => location.reload(); return;
    }
    setTimeout(poll, 1000);
  };
  setTimeout(poll, 2000);
}

let ARMED = {key: null, until: 0};
const armed = key => ARMED.key === key && Date.now() < ARMED.until;
function confirmBtn(btn, question, fn) {
  const key = btn.dataset.key || btn.id;
  if (!btn.dataset.orig) btn.dataset.orig = btn.textContent;
  if (armed(key)) { ARMED = {key: null, until: 0}; btn.textContent = btn.dataset.orig; fn(); return; }
  ARMED = {key, until: Date.now() + 4000}; btn.textContent = question;
  setTimeout(() => { if (ARMED.key === key && Date.now() >= ARMED.until) { ARMED = {key: null, until: 0}; } if (!armed(key) && document.body.contains(btn)) btn.textContent = btn.dataset.orig; }, 4100);
}

    const sh = $("#showSetup"); if (sh) sh.onclick = () => { try { localStorage.removeItem("fvg-setup-hidden"); } catch (e) {} setupKey = ""; setupPanel(); }; return; }
  const next = steps.findIndex(x => !x.done);

  if (b("cpHook")) b("cpHook").onclick = () => copyText(S.hook_url, "Adresse");

  if (b("hookOk")) b("hookOk").onclick = () => act(() => api("/api/hook-confirm", {}), "Super, Alert ist verbunden");

function equitySvg(curve) {

  const vals = pts.map(p => p.e), lo0 = Math.min(0, ...vals), hi0 = Math.max(0, ...vals);

  const lo = Math.floor(lo0 / step) * step, hi = Math.ceil(hi0 / step) * step || step;

  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.e).toFixed(1)}`).join("");

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Equity-Kurve">${g}
    <path d="${line}L${x(pts.length - 1)},${y(Math.max(lo, 0))}L${x(0)},${y(Math.max(lo, 0))}Z" fill="var(--fill)"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/><circle cx="${x(pts.length - 1)}" cy="${y(last.e)}" r="4" fill="${col}"/>
    <text x="${L}" y="${H - 4}">Start</text><text x="${W - R}" y="${H - 4}" text-anchor="end">Trade ${pts.length - 1}</text></svg>`;
}

function field(id, label, value, opts = {}) {
  const attrs = Object.entries(opts.attrs || {}).map(([k, v]) => `${k}="${v}"`).join(" ");
  const inp = opts.select ? `<select id="${id}" data-cfg>${opts.select.map(([v, l]) => `<option value="${v}" ${String(v) === String(value) ? "selected" : ""}>${l}</option>`).join("")}</select>`
    : opts.check ? `<input id="${id}" data-cfg type="checkbox" ${value ? "checked" : ""} class="chk">`
    : `<input id="${id}" data-cfg type="${opts.type || "number"}" value="${esc(value ?? "")}" ${attrs} ${opts.type === "password" ? 'autocomplete="new-password"' : ""}>`;
  return `<div class="row ${opts.cls || ""}" ${opts.hidden ? "hidden" : ""} data-row="${id}"><label for="${id}">${label}${opts.help ? `<small>${opts.help}</small>` : ""}</label>${inp}</div>`;
}
const v = id => { const el = $("#" + id); return !el ? undefined : el.type === "checkbox" ? el.checked : el.value; };
const num = id => { const x = parseFloat(v(id)); return isFinite(x) ? x : undefined; };
const sec = (title, hint, body, id = "") => `<section class="set-sec" ${id ? `id="${id}"` : ""}><div class="set-h"><h2>${title}</h2>${hint ? `<p class="hint">${hint}</p>` : ""}</div><div class="set-b">${body}</div></section>`;

    <pre class="code logbox" id="logTxt"></pre>
    <p class="hint" style="margin:0;word-break:break-all">Datei: ${esc(r.path)}</p>
    <div class="actions"><button class="btn primary" id="logCopy">Alles kopieren</button><button class="btn" id="logClose">Schließen</button></div>`);
  const fill = () => { $("#logTxt").textContent = text(); $("#logTxt").scrollTop = $("#logTxt").scrollHeight; };
  document.querySelectorAll("#mdl [data-v]").forEach(b => b.onclick = () => { view = b.dataset.v === "log" ? "log" : "ev";
    document.querySelectorAll("#mdl [data-v]").forEach(x => x.setAttribute("aria-pressed", x === b)); fill(); });
  fill();
  $("#logCopy").onclick = () => copyText(`FVG Trader ${r.version}\n--- App-Log ---\n${r.log.slice(-120).join("\n")}\n--- Aktivität ---\n${r.events.slice(-60).join("\n")}`, "Protokoll");
  $("#logClose").onclick = close;
}

/* ───────── Laufzeit ───────── */
function render(full) {
  if (!S) return;
  if (full && TAB !== "settings" && $("#main")) { $("#main").oninput = null; $("#main").onchange = null; }
  header();
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === TAB));
  if (TAB === "cockpit") cockpit(full);
  else if (full) ({calendar, stats, learn, settings}[TAB])();
  else if (TAB === "settings" && !settingsDirty && !document.activeElement.matches("input,select")) {
    // Status-Anzeigen live nachziehen (Verbindung, Broker, Updates, Abruf), ohne Eingaben zu stören
    const key = JSON.stringify([S.tunnel, S.hook_url, S.broker, S.update, S.own_sync && S.own_sync.last, S.own_sync && S.own_sync.error, S.autostart]);
    if (key !== settingsKey) { const open = $("details.adv") && $("details.adv").open, y = scrollY; settings(); if (open) $("details.adv").open = true; scrollTo(0, y); }
  }
  else if (TAB === "stats" || TAB === "learn" || TAB === "calendar") ({calendar, stats, learn}[TAB])();
}
async function refresh(full) {
  S = await api("/api/state");
  notifyNew();
  render(full);
}
function notifyNew() {
  const ids = S.pending.map(p => p.id), fresh = ids.filter(id => !seenPending.has(id));
  ids.forEach(id => seenPending.add(id));
  if (firstLoad) { firstLoad = false; return; }
  if (!fresh.length) return;
  const p = S.pending.find(x => x.id === fresh[0]);
  document.title = "● Neuer Vorschlag · FVG Trader";
  setTimeout(() => document.title = "FVG Trader", 8000);
  try { const a = new AudioContext(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .18); } catch (e) {}
  if ("Notification" in window && Notification.permission === "granted")
    new Notification("Neuer Trade-Vorschlag", {body: `${p.side === "long" ? "LONG" : "SHORT"} ${p.qty}× ${p.root} · ${p.setup} · Stop ${px(p.sl)}`});
}
async function start() {
  TAB = ["cockpit", "calendar", "stats", "learn", "settings"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "cockpit";
  shell();
  if ("Notification" in window && Notification.permission === "default") document.addEventListener("click", () => Notification.requestPermission(), {once: true});
  try { await refresh(true); } catch (e) { return; }
  startupUpdatePrompt();
  setInterval(async () => {
    if (TAB === "settings" && settingsDirty) return;
    try { await refresh(false); } catch (e) {}
  }, 2000);
  setInterval(() => S && TAB === "cockpit" && timers(), 1000);
}
fetch("/api/auth").then(r => r.json()).then(a => a.logged_in ? start() : showLogin());
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
