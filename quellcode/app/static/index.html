    ctx.strokeStyle = hl(b) ? C.acc : col; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(a, y); ctx.lineTo(e, y); ctx.stroke(); ctx.setLineDash([]);

    ctx.strokeStyle = hl(s) ? C.acc : "#ff8a3d"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - 4, y - 4); ctx.lineTo(x + 4, y + 4); ctx.moveTo(x + 4, y - 4); ctx.lineTo(x - 4, y + 4); ctx.stroke(); ctx.lineWidth = 1;
  }

  for (let p = Math.ceil(yr[0] / step) * step; p < yr[1]; p += step) ctx.fillText(pfmt(p), pw + 6, Y(p) + 4);

  const fmt = ms => new Date(ms).toLocaleTimeString("de-DE", {hour: "2-digit", minute: "2-digit"});
  let lastLab = -1e9;
  for (let i = Math.max(0, Math.ceil(i0)); i < Math.min(cs.length, i1); i++) {

    ctx.moveTo(Math.round(hx) + .5, 0); ctx.lineTo(Math.round(hx) + .5, ph); ctx.moveTo(0, Math.round(hy) + .5); ctx.lineTo(pw, Math.round(hy) + .5); ctx.stroke(); ctx.setLineDash([]);

    ctx.fillStyle = "#2a2a2a"; const tw = ctx.measureText(tl).width + 12; ctx.fillRect(hx - tw / 2, ph + 2, tw, 18); ctx.fillStyle = C.fg; ctx.textAlign = "center"; ctx.fillText(tl, hx, ph + 15); ctx.textAlign = "left";
  }

  $("#cvO").innerHTML = `<b>${esc(d.fam)} ${d.tf < 60 ? d.tf + "m" : d.tf / 60 + "h"}</b> ${new Date(t).toLocaleString("de-DE", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"})}
    &nbsp; O <span>${pfmt(o)}</span> H <span>${pfmt(h)}</span> L <span>${pfmt(l)}</span> C <span class="${c >= o ? "pos" : "neg"}">${pfmt(c)}</span>`;
}

function cvNice(x) {
  const e = Math.pow(10, Math.floor(Math.log10(x))), f = x / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
}

/* Anklicken: das oberste Objekt unter dem Mauszeiger finden */
function cvPick(x, y) {
  const g = CV.g, L = CV.data.layers, on = k => CV.layers[k], bw = g.bw;
  const hits = [];
  const near = (px, py, r = 8) => Math.hypot(px - x, py - y) <= r;
  const inRect = (a, b, y1, y2) => x >= Math.min(a, b) && x <= Math.max(a, b) && y >= Math.min(y1, y2) - 2 && y <= Math.max(y1, y2) + 2;
  if (on("seen")) L.seen.forEach(s => near(g.XT(s.t), g.Y(s.entry)) && hits.push(["Setup gesehen (nicht genommen)", s, 1]));
  if (on("sweeps")) L.sweeps.forEach(s => near(g.XT(s.t) + bw / 2, g.Y(s.p) + (s.dir > 0 ? 8 : -8)) && hits.push(["Liquiditäts-Sweep", s, 2]));
  if (on("trades")) L.trades.forEach(t => inRect(g.XT(t.t0), Math.max(g.XT(t.t0) + 3, g.XT(t.t1)), g.Y(t.tp || t.entry), g.Y(t.sl0 || t.entry)) && hits.push(["★ Trade", t, 5]));
  if (on("structure")) L.structure.forEach(s => near(g.XT(s.t) + bw / 2, s.kind === "H" ? g.Y(s.p) - 10 : g.Y(s.p) + 10, 10) && hits.push(["Struktur " + s.label, s, 3]));
  if (on("breaks")) L.breaks.forEach(b => x >= g.XT(b.t0) && x <= g.XT(b.t) + bw && Math.abs(g.Y(b.p) - y) <= 5 && hits.push([b.kind === "MSS" ? "Struktur-Bruch MSS (Richtungswechsel)" : "Struktur-Bruch BOS", b, 4]));
  if (on("pools")) L.pools.forEach(p => x >= g.XT(p.t0) && x <= g.XT(p.t1) && Math.abs(g.Y(p.p) - y) <= 5 && hits.push(["Liquidität " + p.name, p, 6]));
  if (on("ob")) L.ob.forEach(z => inRect(g.XT(z.t0), g.XT(z.t1), g.Y(z.top), g.Y(z.bot)) && hits.push(["Orderblock", z, 7]));
  if (on("fvg")) L.fvg.forEach(z => inRect(g.XT(z.t0), g.XT(z.t1), g.Y(z.top), g.Y(z.bot)) && hits.push(["FVG", z, 8]));
  if (on("sessions")) L.sessions.forEach(s => x >= g.XT(s.t0) && x <= g.XT(s.t1) && y < 18 && hits.push(["Session " + s.name, s, 9]));
  hits.sort((a, b) => a[2] - b[2]);
  CV.sel = hits.length ? {kind: hits[0][0], o: hits[0][1], more: hits.length - 1} : null;
  cvInspector(); cvDraw();
}

function cvInspector() {
  const el = $("#cvI"); if (!el) return;
  if (!CV.sel) { el.innerHTML = '<p class="hint">Nichts getroffen. Etwas im Chart anklicken: Trade, Signal, Zone, Level, Sweep oder Struktur.</p>'; return; }
  const o = CV.sel.o, P = v => v == null ? "–" : px(v), T = v => v ? new Date(v).toLocaleString("de-DE", {day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit"}) : "–";
  const R = v => v == null ? "–" : (v > 0 ? "+" : "") + num2(v) + " R";
  let rows = [];
  if (CV.sel.kind.startsWith("★")) rows = [["Richtung", o.side === "long" ? "LONG" : "SHORT"], ["Strategie", o.setup], ["Menge", `${o.qty}× ${o.root}`], ["Einstieg", P(o.entry) + " · " + T(o.t0)],
    ["Stop", P(o.sl0) + (o.sl !== o.sl0 ? ` → ${P(o.sl)}` : "")], ["Ziel", P(o.tp)], ["Ausstieg", o.exit != null ? P(o.exit) + " · " + T(o.t1) : "läuft"],
    ["Grund", o.reason || "–"], ["Ergebnis", o.pnl != null ? sUsd(o.pnl) + " · " + R(o.r) : "–"], ["Verwaltung", o.mgmt || "Signal-Ziel"],
    ...(o.ghost ? [["Ohne frühen Ausstieg", o.ghost.status === "fertig" ? `${o.ghost.how} bei ${R(o.ghost.r)}` : "wird noch verfolgt"]] : []), ["Konto", o.broker + (o.test ? " · Test" : "")]];
  else if (CV.sel.kind.startsWith("Setup")) rows = [["Richtung", o.side === "long" ? "LONG" : "SHORT"], ["Strategie", o.setup], ["Zeit", T(o.t)], ["Einstieg", P(o.entry)], ["Stop / Ziel", `${P(o.sl)} / ${P(o.tp)}`],
    ["Status", o.status], ["Warum nicht", o.reason || "–"], ["Hätte gebracht", o.shadow ? (o.shadow.r != null ? R(o.shadow.r) : "läuft noch") : "–"]];
  else if (CV.sel.kind.startsWith("Liquiditäts-Sweep")) rows = [["Level", o.name], ["Level-Preis", P(o.level)], ["Docht bis", P(o.p)], ["Zeit", T(o.t)], ["Richtung danach", o.dir > 0 ? "aufwärts (Tief geholt)" : "abwärts (Hoch geholt)"]];
  else if (CV.sel.kind.startsWith("Liquidität")) rows = [["Art", o.kind], ["Preis", P(o.p)], ["Ab", T(o.t0)], ["Bis", T(o.t1)], ["Ergebnis", o.swept ? "gesweept " + T(o.swept) : o.broken ? "durchbrochen " + T(o.broken) : "noch offen"]];
  else if (CV.sel.kind.startsWith("Orderblock") || CV.sel.kind === "FVG") rows = [["Richtung", o.dir > 0 ? "bullisch" : "bärisch"], ["Zone", `${P(o.bot)} – ${P(o.top)}`], ["Entstanden", T(o.t0)], ["Zuerst berührt", T(o.touched)], ["Zustand", o.state], ["Bis", T(o.t1)], ...(o.from_break ? [["nach", o.from_break]] : [])];
  else if (CV.sel.kind.startsWith("Struktur-Bruch")) rows = [["Art", o.kind === "MSS" ? "MSS – Richtungswechsel" : "BOS – mit dem Trend"], ["Richtung", o.dir > 0 ? "aufwärts" : "abwärts"], ["Level", P(o.p)], ["Swing", T(o.t0)], ["Bruch", T(o.t)]];
  else if (CV.sel.kind.startsWith("Struktur")) rows = [["Punkt", o.label], ["Preis", P(o.p)], ["Zeit", T(o.t)]];
  else if (CV.sel.kind.startsWith("Session")) rows = [["Session", o.name], ["Von", T(o.t0)], ["Bis", T(o.t1)]];
  el.innerHTML = `<div class="cv-ik">${esc(CV.sel.kind)}${CV.sel.more ? ` <span class="hint">+${CV.sel.more} darunter</span>` : ""}</div>
    <dl class="cv-kv">${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd class="mono">${esc(String(v))}</dd>`).join("")}</dl>
    <details class="cv-raw"><summary class="hint">Rohdaten</summary><pre class="mono">${esc(JSON.stringify(o, null, 1))}</pre></details>`;
}

function chTrack(c, small) {   // Weg von der Verlustgrenze bis zum Ziel
  const lo = c.threshold, hi = c.start + c.cfg.profit_target, span = Math.max(1, hi - lo);
  const at = v => Math.max(0, Math.min(100, (v - lo) / span * 100));

    <div class="trk-b"><i class="trk-f" style="width:${at(c.equity)}%"></i><span class="trk-s" style="left:${at(c.start)}%"></span><span class="trk-e" style="left:${at(c.equity)}%"></span></div>
    ${small ? "" : `<div class="trk-l"><span class="neg">Grenze ${mUsd(lo)}</span>${at(c.start) > 18 && at(c.start) < 82 ? `<span style="left:${at(c.start)}%">Start ${mUsd(c.start)}</span>` : "<span></span>"}<span class="pos">Ziel ${mUsd(hi)}</span></div>`}</div>`;
}
function chChart(c) {
  const d = c.days; if (d.length < 1) return '<p class="hint">Die Kurve erscheint nach dem ersten Handelstag.</p>';
  const W = 900, H = 230, L = 64, R = 14, T = 12, B = 24;
  const pts = [{balance: c.start, threshold: d.length ? (c.cfg.dd_type === "static" ? c.start - c.cfg.max_dd : c.start - c.cfg.max_dd) : c.threshold, day: ""}, ...d];
  const tgt = c.start + c.cfg.profit_target;
  const vals = pts.flatMap(p => [p.balance, p.threshold]).concat([tgt, c.equity]);
  const lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * 0.08 || 100;
  const y0 = lo - pad, y1 = hi + pad;
  const x = i => L + (W - L - R) * i / Math.max(1, pts.length - 1), y = v => T + (H - T - B) * (1 - (v - y0) / (y1 - y0));
  const line = k => pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join("");
  const step = pts.map((p, i) => i ? `L${x(i).toFixed(1)},${y(pts[i - 1].threshold).toFixed(1)}L${x(i).toFixed(1)},${y(p.threshold).toFixed(1)}` : `M${x(0)},${y(p.threshold)}`).join("");
  let g = ""; for (let k = 0; k <= 4; k++) { const v = y0 + (y1 - y0) * k / 4; g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${mUsd(v)}</text>`; }
  const every = Math.ceil(pts.length / 8);
  const xl = pts.map((p, i) => i && (i % every === 0 || i === pts.length - 1) ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${p.day.slice(8)}.${p.day.slice(5, 7)}.</text>` : "").join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Kontoverlauf mit Verlustgrenze">${g}${xl}
    <line x1="${L}" x2="${W - R}" y1="${y(tgt)}" y2="${y(tgt)}" stroke="var(--pos)" stroke-dasharray="5 4" stroke-width="1.2"/><text x="${W - R}" y="${y(tgt) - 6}" text-anchor="end" style="fill:var(--pos)">Ziel</text>
    <path d="${step}" fill="none" stroke="var(--neg)" stroke-width="1.6" stroke-dasharray="1 0" vector-effect="non-scaling-stroke"/><text x="${W - R}" y="${y(pts[pts.length - 1].threshold) + 14}" text-anchor="end" style="fill:var(--neg)">Verlustgrenze</text>
    <path d="${line("balance")}" fill="none" stroke="var(--accent)" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.balance)}" r="3" fill="var(--accent)"><title>${p.day || "Start"}: ${mUsd(p.balance)} · Grenze ${mUsd(p.threshold)}</title></circle>`).join("")}</svg>`;
}
function challenge(full) {

const isoDay = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  if (period === "heute") from = today;
  else if (period === "woche") { const d = new Date(now); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); from = isoDay(d); }
  else if (period === "monat") from = today.slice(0, 8) + "01";
  const days = Object.keys(S.daily || {}).filter(k => k >= from && k <= today).sort().map(k => {
    const d = S.daily[k], b = d.bot || {pnl: 0, n: 0, w: 0}, o = d.eigen || {pnl: 0, n: 0, w: 0};
    const r = src === "bot" ? b : src === "eigen" ? o : {pnl: b.pnl + o.pnl, n: b.n + o.n, w: b.w + o.w};
    return {day: k, pnl: r.pnl, n: r.n, w: r.w};
  }).filter(r => r.n);
  const n = days.reduce((a, r) => a + r.n, 0), w = days.reduce((a, r) => a + r.w, 0), pnl = days.reduce((a, r) => a + r.pnl, 0);

function sparkSvg(vals, W = 320, H = 70) {

function dayBarsSvg(days) {

  let g = ""; for (let v = lo; v <= hi + 1e-9; v += step) g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${kUsd(v)}</text>`;

    return `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="2" fill="${d.pnl >= 0 ? "var(--pos)" : "var(--neg)"}"><title>${d.day}: ${sUsd(d.pnl)} · ${d.n} Trades</title></rect>` +
      (i % every === 0 ? `<text x="${x0 + w / 2}" y="${H - 6}" text-anchor="middle">${d.day.slice(8)}.${d.day.slice(5, 7)}.</text>` : ""); }).join("");

  $("#saveAll").onclick = async () => {
    try { await doSave(); toast("Gespeichert"); await refresh(true); }
    catch (e) { $("#saveMsg").textContent = e.message; $("#saveMsg").className = "err-msg"; }
  };
  $("#tvTest").onclick = async () => {
    try { if (settingsDirty) await doSave(); const r = await api("/api/tradovate/test", {}); toast(r.ok ? r.status : "Fehler: " + r.status); await refresh(true); }
    catch (e) { toast(e.message); }
  };
  const sn = $("#syncNow"); if (sn) sn.onclick = async () => {
    sn.disabled = true; sn.textContent = "Rufe ab …";
    try { const r = await api("/api/own/sync", {}); toast(r.ok ? `${r.added} neue eigene Trades übernommen` : "Fehler: " + r.error); } catch (e) { toast(e.message); }
    await refresh(true);
  };

  $("#dcTest").onclick = async () => {
    const b = $("#dcTest"); b.disabled = true; b.textContent = "Sende …";
    try { await api("/api/discord/test", {url: (v("dcU") || "").trim()}); toast("Testnachricht gesendet – schau in Discord"); } catch (e) { toast(e.message); }
    b.disabled = false; b.textContent = "Testnachricht senden";
  };
  // Protokoll
  $("#logShow").onclick = showLog;
  $("#logFolder").onclick = async () => { try { const r = await api("/api/open-folder", {}); toast("Ordner geöffnet: " + r.folder); } catch (e) { toast(e.message); } };

  // Sofort-Aktionen
  $("#updNowSet").onclick = async () => {
    const b = $("#updNowSet"); b.disabled = true; b.textContent = "Suche …";
    try {
      const u = await api("/api/update/check", {});
      if (u.available) return runUpdate(() => api("/api/update/apply", {}));
      toast(u.error && !u.version ? u.error : `Du hast die neueste Version (${S.version})`);
    } catch (e) { toast(e.message); }
    b.disabled = false; b.textContent = "Jetzt aktualisieren"; refresh(true);
  };
  const mk = $("#mkIcon"); if (mk) mk.onclick = () => act(() => api("/api/shortcut", {}), "Desktop-Symbol angelegt");
  const sv = $("#svcT");
  if (sv) sv.onclick = () => {
    const on = !(S.service || {}).installed;
    serviceSet(on);
  };
  const as = $("#asT"); if (as) as.onclick = () => act(() => api("/api/autostart", {on: !S.autostart}), !S.autostart ? "Startet ab jetzt mit Windows" : "Autostart aus").then(() => render(true));
  $("#quit").onclick = () => confirmBtn($("#quit"), S.positions.length ? "Positionen offen. Trotzdem?" : "Wirklich beenden?", async () => {
    try { await api("/api/shutdown", {}); } catch (e) {}
    document.body.innerHTML = `<div class="login"><form><h1>FVG Trader ist beendet</h1><p class="hint">Signale aus TradingView werden jetzt nicht verarbeitet. Zum Starten auf das Desktop-Symbol <b>FVG Trader</b> klicken.</p><p class="hint">Du kannst dieses Fenster jetzt schließen.</p></form></div>`;
    setTimeout(() => { try { window.close(); } catch (e) {} }, 600);
  });
  $("#cp").onclick = () => copyText(S.hook_url, "Adresse"); $("#cp2").onclick = () => copyText("{{strategy.order.alert_message}}", "Nachricht");
  $("#cpPine2").onclick = async () => { try { const r = await api("/api/pine"); copyText(r.source, "Script"); } catch (e) { toast(e.message); } };
  $("#tNet").onclick = async () => { const b = $("#tNet"); b.disabled = true; b.textContent = "Teste …";
    try { const r = await api("/api/hook/selftest", {}); toast(`Webhook über das Internet erreichbar (${r.ms} ms). Kommt trotzdem nichts an, liegt es am Alert in TradingView.`); }
    catch (e) { toast(e.message); }
    b.disabled = false; b.textContent = "Webhook über Internet testen"; };
  $("#tL").onclick = () => act(() => api("/api/test-signal", {fam: "NQ", side: "long"}).then(r => { TAB = "cockpit"; setHash("cockpit"); return r; }), "Test-Signal gesendet");
  const pr = $("#pr"); if (pr) pr.onclick = () => confirmBtn(pr, "Alle Paper-Trades löschen?", () => act(() => api("/api/paper/reset", {}), "Paper-Konto zurückgesetzt").then(() => render(true)));
  const cpPhone = $("#cpPhone"); if (cpPhone) cpPhone.onclick = () => copyText(phoneUrl, "Adresse");
  $("#rt").onclick = () => confirmBtn($("#rt"), "Alte Adresse wird ungültig. Sicher?", () => act(() => api("/api/token", {}), "Neue Adresse erzeugt: im TradingView-Alert ersetzen").then(() => render(true)));
  $("#updFile").onchange = e => { const f = e.target.files[0]; if (!f) return;
    runUpdate(async () => { const r = await fetch("/api/update/upload", {method: "POST", headers: {"X-Requested-With": "fvg"}, body: f});
      const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "Update fehlgeschlagen"); return j; }); };
}

async function showLog() {
  let r;
  try { r = await api("/api/log"); } catch (e) { toast(e.message); return; }
  let view = "log";
  const text = () => view === "log" ? (r.log.length ? r.log.join("\n") : "(noch keine Einträge)") : (r.events.join("\n") || "(keine Aktivität)");
  const close = modal(`<div class="section-h"><h2 style="font-size:18px">Protokoll · Version ${esc(r.version)}</h2>
      <div class="seg" role="group" aria-label="Ansicht"><button type="button" data-v="log" aria-pressed="true">App-Log</button><button type="button" data-v="ev" aria-pressed="false">Aktivität</button></div></div>
    <pre class="code logbox" id="logTxt"></pre>
    <p class="hint" style="margin:0;word-break:break-all">Datei: ${esc(r.path)}</p>
    <div class="actions"><button class="btn primary" id="logCopy">Alles kopieren</button><button class="btn" id="logClose">Schließen</button></div>`);
  const fill = () => { $("#logTxt").textContent = text(); $("#logTxt").scrollTop = $("#logTxt").scrollHeight; };
  document.querySelectorAll("#mdl [data-v]").forEach(b => b.onclick = () => { view = b.dataset.v === "log" ? "log" : "ev";
    document.querySelectorAll("#mdl [data-v]").forEach(x => x.setAttribute("aria-pressed", x === b)); fill(); });
  fill();
  $("#logCopy").onclick = () => copyText(`FVG Trader ${r.version}\n--- App-Log ---\n${r.log.slice(-120).join("\n")}\n--- Aktivität ---\n${r.events.slice(-60).join("\n")}`, "Protokoll");
  $("#logClose").onclick = close;
}

/* ───────── Nur ein Fenster ───────── */
// Wird FVG Trader ein zweites Mal geöffnet, übernimmt das neue Fenster; das alte schließt sich oder wird gesperrt.
const WIN_ID = Math.random().toString(36).slice(2);
let BLOCKED = false;
const BC = "BroadcastChannel" in window ? new BroadcastChannel("fvg-trader-fenster") : null;
function claimWindow() { BLOCKED = false; const o = $("#winBlock"); if (o) o.remove(); if (BC) BC.postMessage({t: "claim", id: WIN_ID}); }
function blockWindow() {
  if (BLOCKED) return;
  BLOCKED = true;
  try { window.close(); } catch (e) {}
  document.body.insertAdjacentHTML("beforeend", `<div id="winBlock" style="position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:16px">
    <div class="panel" style="max-width:380px;display:flex;flex-direction:column;gap:12px;text-align:center">
      <h2 style="font-size:19px">In einem anderen Fenster geöffnet</h2>
      <p class="hint" style="margin:0">FVG Trader läuft schon in einem anderen Fenster. Du kannst dieses hier schließen.</p>
      <button class="btn primary" id="winHere">Hier weiterverwenden</button></div></div>`);
  $("#winHere").onclick = () => { claimWindow(); refresh(true); };
}
if (BC) BC.onmessage = e => { if (e.data && e.data.t === "claim" && e.data.id !== WIN_ID) blockWindow(); };

/* ───────── Laufzeit ───────── */
function render(full) {
  if (!S) return;
  if (full && TAB !== "settings" && $("#main")) { $("#main").oninput = null; $("#main").onchange = null; }
  header();
  const ct = $(".content"); if (ct) ct.classList.toggle("wide", TAB === "chart");
  document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-current", x.dataset.tab === TAB));
  document.title = "FVG Trader · " + (NAV.find(n => n[0] === TAB) || NAV[0])[1];
  if (TAB === "cockpit") cockpit(full);
  else if (full) ({calendar, stats, learn, settings, challenge, chart: chartPage}[TAB])();
  else if (TAB === "chart") {}
  else if (TAB === "challenge") challenge(false);
  else if (TAB === "settings" && !settingsDirty && !document.activeElement.matches("input,select")) {
    // Status-Anzeigen live nachziehen (Verbindung, Broker, Updates, Abruf), ohne Eingaben zu stören
    const key = JSON.stringify([S.tunnel, S.hook_url, S.broker, S.update, S.own_sync && S.own_sync.last, S.own_sync && S.own_sync.error, S.autostart, S.service]);
    if (key !== settingsKey) { const y = scrollY; settings(); scrollTo(0, y); }
  }
  else if (TAB === "stats" || TAB === "learn" || TAB === "calendar") ({calendar, stats, learn}[TAB])();
}
async function refresh(full) {
  S = await api("/api/state");
  notifyNew();
  render(full);
}
function notifyNew() {
  const ids = S.pending.map(p => p.id), fresh = ids.filter(id => !seenPending.has(id));
  ids.forEach(id => seenPending.add(id));
  if (firstLoad) { firstLoad = false; return; }
  if (!fresh.length) return;
  const p = S.pending.find(x => x.id === fresh[0]);
  document.title = "● Neuer Vorschlag · FVG Trader";
  setTimeout(() => document.title = "FVG Trader", 8000);
  try { const a = new AudioContext(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .18); } catch (e) {}
  if ("Notification" in window && Notification.permission === "granted")
    new Notification("Neuer Trade-Vorschlag", {body: `${p.side === "long" ? "LONG" : "SHORT"} ${p.qty}× ${p.root} · ${p.setup} · Stop ${px(p.sl)}`});
}
async function start() {
  TAB = ["cockpit", "chart", "calendar", "stats", "challenge", "learn", "settings"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "cockpit";
  shell();
  if ("Notification" in window && Notification.permission === "default") document.addEventListener("click", () => Notification.requestPermission(), {once: true});
  try { await refresh(true); } catch (e) { return; }
  startupUpdatePrompt();
  claimWindow();
  // Über die Internet-Adresse (Handy) seltener abfragen: ngrok kostenlos erlaubt 20.000 Anfragen im Monat,
  // und die braucht vor allem TradingView. Im Hintergrund (Tab nicht sichtbar) gar nicht abfragen.
  const REMOTE_UI = !["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
  let lastPoll = Date.now();
  const poll = async force => {
    if (BLOCKED || document.hidden) return;
    if (TAB === "settings" && settingsDirty) return;
    const every = REMOTE_UI ? (S && S.positions && S.positions.length ? 10000 : 30000) : 2000;
    if (!force && Date.now() - lastPoll < every) return;
    lastPoll = Date.now();
    try { await refresh(false); } catch (e) {}
  };
  setInterval(() => poll(false), 1000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(true); });
  setInterval(() => !BLOCKED && S && TAB === "cockpit" && timers(), 1000);
}
fetch("/api/auth").then(r => r.json()).then(a => a.logged_in ? start() : showLogin());
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
